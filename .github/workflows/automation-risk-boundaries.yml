name: Automation Risk Boundaries
on:
  push:
    branches: [index-alert-automation-risk-boundary-fix-v1]
    paths: [indexalert_automation_control.py, test_automation_risk_boundaries.py, .github/workflows/automation-risk-boundaries.yml]
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths: [indexalert_automation_control.py, test_automation_risk_boundaries.py, .github/workflows/automation-risk-boundaries.yml]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            indexalert_automation_control.py
            test_indexalert_automation_control.py
            test_automation_risk_boundaries.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_indexalert_automation_control test_automation_risk_boundaries
