name: Probability v3.8 calendar holdout research
on:
  push:
    branches: [index-alert-server]
    paths:
      - 'probability_v38_calendar.py'
      - '.github/workflows/probability-v38-calendar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Calendar untouched holdout
        run: |
          python - <<'PY'
          import json, time
          import next_day_probability as base
          import probability_v38_calendar as research

          for symbol in ('SPY','QQQ','SCHD'):
              rows, meta = base.fetch_history(symbol, time.time())
              dates = [d for d, _ in rows]
              prices = [p for _, p in rows]
              result = research.evaluate(prices, dates, meta['target_date'])
              print('V38_RESEARCH', symbol, json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
