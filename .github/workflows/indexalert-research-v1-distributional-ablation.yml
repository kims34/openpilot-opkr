name: IndexAlert Research v1 Distributional Ablation

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_distributional_ablation.py'
      - 'research_v1_distributional_netev.py'\n      - 'research_v1_context.py'
      - '.github/workflows/indexalert-research-v1-distributional-ablation.yml'
  workflow_dispatch:

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 requests==2.32.3 pyarrow==21.0.0 scikit-learn==1.7.2
      - uses: actions/cache@v4
        with:
          path: research_data/marcap_raw
          key: marcap-fast-v1-2024-01-01-2026-09-28
          restore-keys: |
            marcap-pit-v2-
            marcap-pit-v1-
      - uses: actions/cache@v4
        with:
          path: research_data/pit_supervised_v1
          key: pit-supervised-v1-2024-01-01-2026-09-28-h5-t040-s025-c3
      - run: python research_v1_marcap.py --start 2024-01-01 --end 2026-09-28 --out research_data/marcap_kospi_pit --raw research_data/marcap_raw
      - run: python research_v1_distributional_ablation.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-research-v1-distributional-ablation
          path: research_results/marcap_pit_distributional_ablation/
          retention-days: 30
