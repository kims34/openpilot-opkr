name: Durable Order Intent Journal
on:
  push:
    branches: [index-alert-durable-order-journal-v1, index-alert-position-regen-fix-v1]
    paths: ['order_intent_journal.py', 'test_order_intent_journal.py', '.github/workflows/order-intent-journal.yml']
  pull_request:
    paths: ['order_intent_journal.py', 'test_order_intent_journal.py', '.github/workflows/order-intent-journal.yml']
jobs:
  offline-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            order_intent_journal.py
            test_order_intent_journal.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest test_order_intent_journal -v
