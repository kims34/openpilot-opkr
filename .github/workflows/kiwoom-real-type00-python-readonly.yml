name: Kiwoom REAL Type00 Python Readonly

on:
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'kiwoom_real_type00_readonly_smoke.py'
      - 'test_kiwoom_real_type00_readonly_smoke.py'
      - 'Dockerfile.kiwoom-real-readonly'
      - 'kiwoom_real_readonly/smoke.py'
      - 'kiwoom_real_readonly/Dockerfile'
      - 'kiwoom_real_readonly/README.md'
      - 'railway-kiwoom-real-readonly.json'
      - '.github/workflows/kiwoom-real-type00-python-readonly.yml'
  push:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'kiwoom_real_type00_readonly_smoke.py'
      - 'test_kiwoom_real_type00_readonly_smoke.py'
      - 'Dockerfile.kiwoom-real-readonly'
      - 'kiwoom_real_readonly/smoke.py'
      - 'kiwoom_real_readonly/Dockerfile'
      - 'kiwoom_real_readonly/README.md'
      - 'railway-kiwoom-real-readonly.json'
      - '.github/workflows/kiwoom-real-type00-python-readonly.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 websockets==15.0.1
      - run: python -m py_compile kiwoom_real_type00_readonly_smoke.py
      - run: python -m unittest test_kiwoom_real_type00_readonly_smoke.py
      - name: Assert no order endpoint or authority is present
        run: |
          ! grep -E '/api/dostk/ordr|kt10000|kt10001|kt10002|kt10003' kiwoom_real_type00_readonly_smoke.py
          grep -F 'ORDERING: str = "DISABLED"' kiwoom_real_type00_readonly_smoke.py
          grep -F 'REAL_ORDERS_AUTHORIZED: bool = False' kiwoom_real_type00_readonly_smoke.py
      - name: Assert isolated Railway packaging
        run: |
          grep -F '"dockerfilePath": "Dockerfile.kiwoom-real-readonly"' railway-kiwoom-real-readonly.json
          grep -F '"startCommand": "python -B kiwoom_real_type00_readonly_smoke.py"' railway-kiwoom-real-readonly.json
          grep -F '"restartPolicyType": "NEVER"' railway-kiwoom-real-readonly.json

      - name: Assert isolated subdirectory mirror
        run: |
          cmp -s kiwoom_real_type00_readonly_smoke.py kiwoom_real_readonly/smoke.py
          grep -Fx 'COPY smoke.py ./' kiwoom_real_readonly/Dockerfile
          grep -F 'CMD ["python","-B","smoke.py"]' kiwoom_real_readonly/Dockerfile
