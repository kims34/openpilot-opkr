name: IndexAlert Data Probe
on:
  push:
    branches: [ index-alert-build ]
    paths:
      - '.github/workflows/index-alert-data-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe Yahoo futures metadata
        run: |
          python - <<'PY'
          import requests, json
          from urllib.parse import quote
          for sym in ['ES=F','NQ=F','SCHD','^GSPC','^NDX','^DJUSDIV']:
              url=f'https://query1.finance.yahoo.com/v8/finance/chart/{quote(sym,safe="")}'
              r=requests.get(url,params={'range':'5d','interval':'5m','includePrePost':'true'},headers={'User-Agent':'Mozilla/5.0'},timeout=20)
              print('\nSYMBOL',sym,'HTTP',r.status_code)
              r.raise_for_status()
              res=r.json()['chart']['result'][0]
              m=res.get('meta',{})
              closes=res.get('indicators',{}).get('quote',[{}])[0].get('close',[])
              latest=next((x for x in reversed(closes) if x is not None),None)
              keys=['regularMarketPrice','previousClose','chartPreviousClose','marketState','exchangeTimezoneName','currentTradingPeriod']
              print('latestClose=',latest)
              for k in keys:
                  print(k,'=',json.dumps(m.get(k),ensure_ascii=False))
          PY
