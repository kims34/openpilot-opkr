name: IndexAlert Candidate Merge Source Audit (Non-Admitting)

on:
  pull_request:
    branches:
      - index-alert-backtest-runtime-opt-v1-20261013
    paths:
      - 'research_v1_runtime_candidate_merge_gate.py'
      - 'test_research_v1_runtime_candidate_merge_gate.py'
      - '.github/workflows/indexalert-candidate-merge-audit-ci.yml'
      - 'research_v1_runtime_archived_source_gate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-merge-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-merge-proof-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Default pull_request checkout is GitHub's PR synthetic merge ref.
      # Never override to PR head to bypass upstream implementation drift.
      - uses: actions/checkout@v4
      - name: Bind checked-out synthetic merge first-parent SHA, not stale event SHA
        shell: bash
        run: |
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          echo "INDEXALERT_BASE_HEAD_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-indexalert-runtime-ci.txt
      - name: Install existing pinned offline regression dependencies
        run: python -m pip install -r requirements-indexalert-runtime-ci.txt
      - name: Verify unchanged archived dependency versions
        run: python research_v1_runtime_archived_env_gate.py
      - name: Verify reviewed upstream candidate merge source lineage
        run: python research_v1_runtime_candidate_merge_gate.py
      - name: Negative controls on source lineage and upstream TOCTOU
        run: |
          python -m unittest -q test_research_v1_runtime_candidate_merge_gate
          python -m unittest -q test_research_v1_runtime_ci_integrity
      - name: Confirm old 34 archived case names and outcomes against new candidate
        run: python research_v1_runtime_pinned_parallel.py --out-dir runtime_opt_results/candidate_merge
      - name: Upload NON-ADMITTING candidate parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-candidate-merge-evidence
          path: runtime_opt_results/candidate_merge/
          retention-days: 14
          if-no-files-found: warn
