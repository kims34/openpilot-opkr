name: IndexAlert Prospective Session Commit

on:
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_krx_openapi_prospective_source.py'
      - 'research_v1_prospective_inputs.py'
      - 'research_v1_prospective_model_bundle.py'
      - 'research_v1_prospective_frozen_producer.py'
      - 'research_v1_prospective_decision_capture.py'
      - 'research_v1_prospective_session_commit.py'
      - 'test_research_v1_prospective_session_commit.py'
      - 'INDEXALERT_PROSPECTIVE_SESSION_COMMIT_2026-10-08.md'
      - '.github/workflows/indexalert-prospective-session-commit.yml'
  push:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_krx_openapi_prospective_source.py'
      - 'research_v1_prospective_inputs.py'
      - 'research_v1_prospective_model_bundle.py'
      - 'research_v1_prospective_frozen_producer.py'
      - 'research_v1_prospective_decision_capture.py'
      - 'research_v1_prospective_session_commit.py'
      - 'test_research_v1_prospective_session_commit.py'
      - 'INDEXALERT_PROSPECTIVE_SESSION_COMMIT_2026-10-08.md'
      - '.github/workflows/indexalert-prospective-session-commit.yml'

permissions:
  contents: read

jobs:
  structural-session:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install synthetic-test dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 requests==2.32.3
      - name: Verify transactional source-to-decision commit boundary
        run: python -m unittest test_research_v1_prospective_session_commit.py
