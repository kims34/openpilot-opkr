name: IndexAlert Research v1 FDR Status Probe

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_fdr_status_probe.py'
      - '.github/workflows/indexalert-research-v1-fdr-status-probe.yml'
  workflow_dispatch:

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned FinanceDataReader
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 requests==2.32.3 lxml beautifulsoup4
          pip install 'git+https://github.com/FinanceData/FinanceDataReader.git@addcbb7e887f0db6176a87d323de5de28357b5f4'
      - name: Run metadata-only status probe
        run: |
          python -m py_compile research_v1_fdr_status_probe.py
          python research_v1_fdr_status_probe.py
          cat research_results/fdr_status_probe/summary.json
      - name: Upload metadata-only probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-research-v1-fdr-status-probe
          path: research_results/fdr_status_probe/summary.json
          if-no-files-found: warn
          retention-days: 7
