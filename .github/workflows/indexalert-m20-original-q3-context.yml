name: IndexAlert M20 Original Q3 Operating Context Shape

on:
  pull_request:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_opendart_original_q3_contexts.py'
      - 'test_research_v1_opendart_original_q3_contexts.py'
      - '.github/workflows/indexalert-m20-original-q3-context.yml'
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_opendart_original_q3_contexts.py'
      - 'test_research_v1_opendart_original_q3_contexts.py'
      - '.github/workflows/indexalert-m20-original-q3-context.yml'

permissions:
  contents: read

jobs:
  offline-context-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 defusedxml==0.7.1
      - run: python -m py_compile research_v1_opendart_original_q3_contexts.py test_research_v1_opendart_original_q3_contexts.py
      - run: python -m unittest -v test_research_v1_opendart_original_q3_contexts.py
      - name: Verify no PIT/performance/order permission and no broker or KRX access
        run: |
          ! grep -E '(data.krx.co.kr|data-dbg.krx.co.kr|api.kiwoom.com|/api/dostk/ordr)' research_v1_opendart_original_q3_contexts.py
          grep -F '"historical_pit_source_admitted": False' research_v1_opendart_original_q3_contexts.py
          grep -F '"feature_performance_testing_authorized": False' research_v1_opendart_original_q3_contexts.py
          grep -F '"real_orders_authorized": False' research_v1_opendart_original_q3_contexts.py
          grep -F '"ordering": "DISABLED"' research_v1_opendart_original_q3_contexts.py

  official-archival-context-counts:
    if: github.event_name == 'push'
    needs: offline-context-shape
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 defusedxml==0.7.1
      - name: Read original official Q3 XBRL concept and periods without exposing amounts
        run: |
          python research_v1_opendart_original_q3_contexts.py
          python -c "import json; p=json.load(open('research_results/opendart_m20_original_xbrl_context/summary.json',encoding='utf8')); assert p['source_status']=='XBRL_ORIGINAL_Q3_CONTEXT_COUNTS_OBSERVED_NOT_PIT_ADMITTED'; assert p['historical_pit_source_admitted'] is False; assert p['live_order_authorized'] is False"
      - name: Retain only bounded metadata counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-m20-xbrl-q3-context-counts-only
          path: research_results/opendart_m20_original_xbrl_context/summary.json
          retention-days: 7
          if-no-files-found: warn
