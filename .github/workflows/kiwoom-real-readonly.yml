name: Kiwoom REAL Read-Only Boundary

on:
  pull_request:
    paths:
      - 'kiwoom_real_readonly_preparation.py'
      - 'kiwoom_real_readonly_transport.py'
      - 'kiwoom_real_readonly_smoke.py'
      - 'test_kiwoom_real_readonly_preparation.py'
      - 'test_kiwoom_real_readonly_transport.py'
      - '.github/workflows/kiwoom-real-readonly.yml'
  push:
    branches:
      - index-alert-position-regen-fix-v1
    paths:
      - 'kiwoom_real_readonly_preparation.py'
      - 'kiwoom_real_readonly_transport.py'
      - 'kiwoom_real_readonly_smoke.py'
      - 'test_kiwoom_real_readonly_preparation.py'
      - 'test_kiwoom_real_readonly_transport.py'
      - '.github/workflows/kiwoom-real-readonly.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_kiwoom_real_readonly_preparation.py test_kiwoom_real_readonly_transport.py
