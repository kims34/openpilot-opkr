name: Probability v2.3 held-out research
on:
  push:
    branches: [index-alert-probability-v23]
    paths:
      - 'probability_research_v23.py'
      - 'probability_research_v23b.py'
      - '.github/workflows/probability-v23-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas requests
      - name: Cross-asset ridge research
        run: python probability_research_v23.py | tee probability-v23-result.txt
      - name: Adaptive baseline research
        run: python probability_research_v23b.py | tee probability-v23b-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probability-v23-results
          path: |
            probability-v23-result.txt
            probability-v23b-result.txt
