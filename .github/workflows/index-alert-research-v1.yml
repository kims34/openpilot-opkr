name: IndexAlert Research v1

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_kospi_clean_v2.py'
      - 'research_kospi_abstention_v3.py'
      - '.github/workflows/index-alert-research-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kospi-abstention-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index-alert-research-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal research dependencies
        run: pip install pandas==2.3.3 pyarrow==21.0.0 scikit-learn==1.7.2 numpy==2.4.6

      - name: Syntax checks
        run: |
          python -m py_compile research_kospi_clean_v2.py
          python -m py_compile research_kospi_abstention_v3.py

      - name: Fetch historical KRX cross-sections
        run: |
          mkdir -p /tmp/marcap/data
          for y in 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            curl -fL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-$y.parquet" \
              -o "/tmp/marcap/data/marcap-$y.parquet"
          done

      - name: Run frozen-threshold abstention challenger
        run: |
          mkdir -p research_results
          python research_kospi_abstention_v3.py \
            --from-date 2018-01-02 \
            --to-date 2026-09-25 \
            --marcap-dir /tmp/marcap/data \
            --output research_results/kospi_abstention_v3.json

      - name: Create compact v3 summary
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('research_results/kospi_abstention_v3.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          result = d.get('result') or {}
          summary = {
              'research_version': d.get('research_version'),
              'parent_model': d.get('parent_model'),
              'universe_version': d.get('universe_version'),
              'from_date': d.get('from_date'),
              'to_date': d.get('to_date'),
              'trading_days': d.get('trading_days'),
              'observation_rows': d.get('observation_rows'),
              'coverages_predeclared': d.get('coverages_predeclared'),
              'threshold_rule': d.get('threshold_rule'),
              'daily_admission_rule': d.get('daily_admission_rule'),
              'coverage_matched_controls': d.get('coverage_matched_controls'),
              'cost_scenarios': d.get('cost_scenarios'),
              'policies': result.get('policies'),
              'research_status': d.get('research_status'),
              'profitability_validated': d.get('profitability_validated'),
              'limitations': d.get('limitations'),
          }
          pathlib.Path('research_results/kospi_abstention_v3_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, allow_nan=False) + '\n', encoding='utf-8')
          PY

      - name: Persist reproducible v3 result
        run: |
          git config user.name 'indexalert-research-bot'
          git config user.email 'indexalert-research-bot@users.noreply.github.com'
          git add research_results/kospi_abstention_v3.json research_results/kospi_abstention_v3_summary.json
          git commit -m 'Store KOSPI abstention v3 research result' || exit 0
          git push origin HEAD:index-alert-research-v1
