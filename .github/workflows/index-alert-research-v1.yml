name: IndexAlert Research v1

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_kospi_clean_v2.py'
      - '.github/workflows/index-alert-research-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kospi-research-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index-alert-research-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal research dependencies
        run: pip install pandas==2.3.3 pyarrow==21.0.0 scikit-learn==1.7.2 numpy==2.4.6

      - name: Syntax check
        run: python -m py_compile research_kospi_clean_v2.py

      - name: Fetch historical KRX cross-sections
        run: |
          mkdir -p /tmp/marcap/data
          for y in 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            curl -fL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-$y.parquet" \
              -o "/tmp/marcap/data/marcap-$y.parquet"
          done

      - name: Run clean KOSPI walk-forward tournament
        run: |
          mkdir -p research_results
          python research_kospi_clean_v2.py \
            --from-date 2018-01-02 \
            --to-date 2026-09-25 \
            --marcap-dir /tmp/marcap/data \
            --output research_results/kospi_clean_v2.json

      - name: Create compact v2 summary
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('research_results/kospi_clean_v2.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          wf = d.get('walk_forward') or {}
          s = {
            'research_version': d.get('research_version'),
            'model_version': d.get('model_version'),
            'universe_version': d.get('universe_version'),
            'data_source': d.get('data_source'),
            'from_date': d.get('from_date'),
            'to_date': d.get('to_date'),
            'trading_days': d.get('trading_days'),
            'raw_filtered_rows': d.get('raw_filtered_rows'),
            'observation_rows': d.get('observation_rows'),
            'common_share_rule': d.get('common_share_rule'),
            'cost_scenarios': d.get('cost_scenarios'),
            'research_status': d.get('research_status'),
            'profitability_validated': d.get('profitability_validated'),
            'models': wf.get('models'),
            'calibration': wf.get('calibration'),
            'folds': wf.get('folds'),
            'limitations': d.get('limitations'),
          }
          pathlib.Path('research_results/kospi_clean_v2_summary.json').write_text(
              json.dumps(s, ensure_ascii=False, indent=2, allow_nan=False) + '\n', encoding='utf-8')
          PY

      - name: Persist reproducible v2 results
        run: |
          git config user.name 'indexalert-research-bot'
          git config user.email 'indexalert-research-bot@users.noreply.github.com'
          git add research_results/kospi_clean_v2.json research_results/kospi_clean_v2_summary.json
          git commit -m 'Store KOSPI clean v2 research result' || exit 0
          git push origin HEAD:index-alert-research-v1
