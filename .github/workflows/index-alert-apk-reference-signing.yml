name: IndexAlert APK reference signing audit
on:
  pull_request:
    branches: [ index-alert-build ]
    paths:
      - '.github/workflows/index-alert-apk-reference-signing.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,pathlib
          references=[
            ("reference",11158994269,36856589300,"5154ef7943353791f615622394523ecd52ef8b0f",
             "IndexAlert-v4.7-debug","0aec298a0d0276f8a5e40dc22429b595e8bb11636f22ceeea75cb018a4a7e411"),
            ("candidate",11371148102,37376198533,"9b39efcb7977dfa77c54f3274d17a90469cdd194",
             "IndexAlert-v4.8-debug","5b7b2d0248aa2bc493b5dc5401cad69596b6c59f2af0d069b14902a3c7765db1")]
          metadata=[]
          for role,artifact_id,run_id,sha,name,digest in references:
              raw=subprocess.check_output(["gh","api",f"repos/kims34/openpilot-opkr/actions/artifacts/{artifact_id}"],text=True)
              artifact=json.loads(raw)
              assert artifact["id"]==artifact_id and artifact["name"]==name and not artifact["expired"]
              assert artifact["digest"]=="sha256:"+digest
              assert artifact["workflow_run"]["id"]==run_id and artifact["workflow_run"]["head_sha"]==sha
              metadata.append({"role":role,"artifact_id":artifact_id,"run_id":run_id,
                  "source_head":sha,"archive_sha256":digest,"name":name})
          pathlib.Path("apk-reference-metadata.json").write_text(json.dumps(metadata,indent=2)+"\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11158994269'
          run-id: '36856589300'
          github-token: ${{ github.token }}
          repository: kims34/openpilot-opkr
          path: reference-apk
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11371148102'
          run-id: '37376198533'
          github-token: ${{ github.token }}
          repository: kims34/openpilot-opkr
          path: candidate-apk
          merge-multiple: true
      - name: Compare actual historical and candidate APK signers
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          sdk=pathlib.Path(os.environ["ANDROID_HOME"])/"build-tools"
          tools=sorted(p for p in sdk.iterdir() if (p/"aapt2").is_file() and (p/"apksigner").is_file())
          assert tools, "SDK tools required"
          tool=tools[-1]
          records=[]
          metadata=json.loads(pathlib.Path("apk-reference-metadata.json").read_text())
          for item,version,code in zip(metadata,("4.7","4.8"),(47,48)):
              apks=list(pathlib.Path(item["role"]+"-apk").rglob("*.apk"))
              assert len(apks)==1, "Exactly one downloaded APK required"
              apk=apks[0]
              badging=subprocess.check_output([str(tool/"aapt2"),"dump","badging",str(apk)],text=True)
              package=next(x for x in badging.splitlines() if x.startswith("package:"))
              assert "name='com.indexalert.app'" in package
              assert f"versionCode='{code}'" in package and f"versionName='{version}'" in package
              signature=subprocess.run([str(tool/"apksigner"),"verify","--verbose","--print-certs",str(apk)],capture_output=True,text=True)
              assert signature.returncode==0, "Actual APK signature verification required"
              certs=sorted(set(re.findall(r"certificate SHA-256 digest: ([0-9a-fA-F]{64})",signature.stdout)))
              assert certs, "Public signer fingerprint required"
              records.append({**item,"version_name":version,"version_code":code,
                  "application_id":"com.indexalert.app","apk_sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
                  "size_bytes":apk.stat().st_size,"signature_verified":True,"signer_sha256":certs})
          assert records[1]["apk_sha256"]=="6ae4cc5f6ca503461396c9ca69dd19866d5f3077375b923a41162b9a543e7855"
          assert records[1]["signer_sha256"]==["24d1f8adf0b2ed7ad2d47c2f7d957105ce8297fa76b6620d908549c22286ad23"]
          matches=records[0]["signer_sha256"]==records[1]["signer_sha256"]
          event=json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          result={"schema_version":"INDEXALERT_ANDROID_REFERENCE_SIGNING_v1",
              "source_head":event.get("pull_request",{}).get("head",{}).get("sha") or os.environ["GITHUB_SHA"],
              "run_id":os.environ["GITHUB_RUN_ID"],"artifacts":records,
              "reference_candidate_signers_match":matches,
              "historical_artifact_is_installed_device_proof":False,
              "installed_signing_continuity_verified":False,
              "physical_e2e_verified":False,"apk_installed":False,"app_uninstalled":False,
              "broker_request_sent":False,"orders_requested":False,
              "live_ordering_authorized":False,"frozen_criteria_changed":False}
          pathlib.Path("indexalert_android_reference_signing.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: IndexAlert-historical-reference-signing-audit
          path: |
            indexalert_android_reference_signing.json
            apk-reference-metadata.json
