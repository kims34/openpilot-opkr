name: One-time KOSPI composite app migration

on:
  push:
    branches: [ index-alert-build ]
    paths:
      - '.github/workflows/fix-kospi-composite.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: index-alert-build
          fetch-depth: 0
      - name: Update app from KOSPI100 to KOSPI composite
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index-alert/app/src/main/java/com/indexalert/app/MainActivity.kt')
          s = p.read_text()
          replacements = {
              '"kospi100", "KOSPI 100", "KOSPI100.KS", null,': '"kospi100", "KOSPI", "^KS11", null,',
              '"KOSPI 100 지수 · 표시 전용 (알림 없음)"': '"코스피 종합지수 · 표시 전용 (알림 없음)"',
              'Text("SPY · QQQ · SCHD · KOSPI100 / ATH 기준 현황"': 'Text("SPY · QQQ · SCHD · KOSPI / ATH 기준 현황"',
              '"KOSPI100은 지수 현황만 표시하며 알림을 보내지 않습니다. 개별종목 TOP10은 서버 캐시를 주기적으로 갱신합니다. "': '"KOSPI는 코스피 종합지수 현황만 표시하며 알림을 보내지 않습니다. 개별종목 TOP10은 서버 캐시를 주기적으로 갱신합니다. "',
              '"KOSPI 100 지수 · 로컬 보조 조회"': '"KOSPI 종합지수 · 로컬 보조 조회"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s = s.replace(old, new)

          needle = '        super.onCreate(savedInstanceState)\n'
          insert = '''        super.onCreate(savedInstanceState)\n        // v1.1: KOSPI100 -> KOSPI composite. Clear only the old local KOSPI ATH cache once.\n        val statePrefs = getSharedPreferences("state", Context.MODE_PRIVATE)\n        if (!statePrefs.getBoolean("kospi_composite_v1_migrated", false)) {\n            statePrefs.edit()\n                .remove("ath_cash_kospi100")\n                .remove("ath_ts_kospi100")\n                .remove("ath_day_kospi100")\n                .putBoolean("kospi_composite_v1_migrated", true)\n                .apply()\n        }\n'''
          if needle not in s:
              raise SystemExit('onCreate insertion point missing')
          s = s.replace(needle, insert, 1)
          p.write_text(s)

          g = Path('index-alert/app/build.gradle.kts')
          b = g.read_text()
          if 'versionCode = 10' in b:
              b = b.replace('versionCode = 10', 'versionCode = 11', 1)
          if 'versionName = "1.0"' in b:
              b = b.replace('versionName = "1.0"', 'versionName = "1.1"', 1)
          g.write_text(b)
          PY

          rm .github/workflows/fix-kospi-composite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-alert/app/src/main/java/com/indexalert/app/MainActivity.kt index-alert/app/build.gradle.kts .github/workflows/fix-kospi-composite.yml
          git commit -m "Switch app display from KOSPI100 to KOSPI composite"
          git push origin HEAD:index-alert-build
