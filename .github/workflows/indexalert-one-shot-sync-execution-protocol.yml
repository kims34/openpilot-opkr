name: IndexAlert One-shot Execution Protocol Doc Sync

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - '.github/workflows/indexalert-one-shot-sync-execution-protocol.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize canonical status and execution contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_section(text, start_heading, end_heading, replacement):
              start = text.find(start_heading)
              if start < 0:
                  raise SystemExit(f'missing start heading: {start_heading}')
              end = text.find(end_heading, start)
              if end < 0:
                  raise SystemExit(f'missing end heading: {end_heading}')
              return text[:start] + replacement.rstrip() + '\n\n' + text[end:]

          status = Path('INDEXALERT_RESEARCH_STATUS.md')
          s = status.read_text(encoding='utf-8')
          status_lines = [
              '## Execution-sufficiency preregistration — project v1 frozen, genuine LIVE not yet observed',
              '',
              'Canonical preregistration/evaluator stack is now:',
              '- `INDEXALERT_EXECUTION_SUFFICIENCY_PROTOCOL.md` — human-readable frozen protocol;',
              '- `INDEXALERT_EXECUTION_SUFFICIENCY_PROTOCOL.json` — SHA-256-bound machine-readable schema v2 criteria;',
              '- `research_v1_execution_sufficiency_protocol.py` — fail-closed preregistration validator with legacy schema-v1 compatibility;',
              '- `research_v1_execution_sufficiency_assessment.py` — independent genuine-LIVE evaluator.',
              '',
              'The project protocol was frozen before any genuine LIVE observation. Core criteria include at least 600 LIVE observations across at least 200 distinct decision dates, at least 400 filled observations, decision-time PIT ADV participation capped at the existing research assumption `0.0005` (0.05%), 120 near-capacity observations at >=80% of that ceiling, date-cluster fill/slippage gates, Wilson no-fill/partial-fill bounds, 5m/30m/close markouts with ES95/ES99 reporting, latency/expiry controls, fee/tax comparison, and zero unknown/reconciliation/risk/capacity-integrity breaches. Thresholds are bound to the protocol document fingerprint and may not be weakened using outcomes from the evidence window they judge.',
              '',
              'The evaluator accepts only `PROSPECTIVE_LIVE_EXECUTION_LOG`, requires the frozen decision/execution policy IDs and PIT provenance timestamps, and keeps `promotion_ready=false`, `sealed_holdout_authorized=false` and `live_trading_authorized=false` even if the execution-only gates later pass.',
              '',
              'No genuine staged LIVE execution observations exist yet, so current project state remains:',
              '- `live_empirical_execution_evidence_ready=false`;',
              '- `empirical_execution_sufficiency_assessed=false`;',
              '- `empirical_execution_blocker_closed=false`;',
              '- `promotion_ready=false`.',
              '',
              'Historical preregistration Actions `36835013828` and `36835231533` succeeded. The frozen project protocol/evaluator Action `36881327868` also succeeded. Unit-test fixtures exercise pass/fail code paths only and are not project evidence.',
          ]
          s = replace_section(
              s,
              '## Execution-sufficiency preregistration',
              '## Android / push Physical E2E state',
              '\n'.join(status_lines),
          )
          status.write_text(s, encoding='utf-8')

          contract = Path('INDEXALERT_EXECUTION_EVIDENCE_CONTRACT.md')
          c = contract.read_text(encoding='utf-8')
          replacements = [
              (
                  'The numeric values used in unit-test fixtures are illustrative test data only and are not IndexAlert promotion thresholds.',
                  'Unit-test fixture values remain non-evidence. The canonical IndexAlert project thresholds are now frozen separately in `INDEXALERT_EXECUTION_SUFFICIENCY_PROTOCOL.md` and its SHA-256-bound `INDEXALERT_EXECUTION_SUFFICIENCY_PROTOCOL.json`; they were fixed before any genuine LIVE observation.'
              ),
              (
                  'A later evaluator may assess genuine LIVE evidence against a properly frozen protocol, but that assessment must remain separate from the protocol-registration step.',
                  '`research_v1_execution_sufficiency_assessment.py` is the separate evaluator for genuine LIVE evidence against the frozen project protocol. Protocol registration and evidence assessment remain independent steps.'
              ),
              (
                  '- Empirical execution sufficiency = a separate future assessment that is currently **not assessed / not closed**.',
                  '- Empirical execution sufficiency = a separate genuine-LIVE assessment that is currently **not assessed / not closed because no genuine LIVE evidence window exists yet**.'
              ),
              (
                  'The research integrity schema separates PAPER from LIVE, separates LIVE structural presence from empirical sufficiency, and has a fail-closed preregistration validator preventing post-hoc execution-sufficiency threshold selection. Real-account ordering remains disabled. No synthetic execution observations may be inserted to populate the ledger.\n\nThe empirical execution blocker remains open. A genuinely frozen future sufficiency protocol plus staged LIVE evidence and its later independent assessment are still required.',
                  'The research integrity schema separates PAPER from LIVE, separates LIVE structural presence from empirical sufficiency, and has a fail-closed preregistration validator preventing post-hoc execution-sufficiency threshold selection. The project protocol is now frozen in `INDEXALERT_EXECUTION_SUFFICIENCY_PROTOCOL.md` / `.json`, and the independent evaluator is implemented and Actions-tested. Real-account ordering remains disabled. No synthetic execution observations may be inserted to populate the ledger.\n\nThe empirical execution blocker remains open because genuine staged LIVE evidence has not been collected or assessed. The frozen protocol must be evaluated on that future genuine-LIVE window; passing it still does not independently authorize sealed holdout, promotion or live trading.'
              ),
          ]
          for old, new in replacements:
              if old not in c:
                  raise SystemExit(f'canonical execution contract text not found: {old[:80]}')
              c = c.replace(old, new)
          contract.write_text(c, encoding='utf-8')
          PY
      - name: Commit synchronized documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add INDEXALERT_RESEARCH_STATUS.md INDEXALERT_EXECUTION_EVIDENCE_CONTRACT.md
          git diff --cached --check
          git commit -m 'Sync status with frozen execution sufficiency protocol'
          git push origin HEAD:index-alert-research-v1
