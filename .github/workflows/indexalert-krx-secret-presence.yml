name: IndexAlert KRX Secret Presence Check

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - '.github/workflows/indexalert-krx-secret-presence.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify required KRX secrets exist without exposing values
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python - <<'PY'
          import os, json
          result = {
              "KRX_ID_present": bool(os.environ.get("KRX_ID", "").strip()),
              "KRX_PW_present": bool(os.environ.get("KRX_PW", "").strip()),
          }
          print(json.dumps(result))
          if not all(result.values()):
              raise SystemExit(1)
          PY
