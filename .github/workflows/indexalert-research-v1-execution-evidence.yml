name: IndexAlert Research v1 Execution Evidence Integrity

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_execution_evidence.py'
      - 'test_research_v1_execution_evidence.py'
      - 'research_v1_execution_sufficiency_protocol.py'
      - 'test_research_v1_execution_sufficiency_protocol.py'
      - 'research_v1_execution_sufficiency_assessment.py'
      - 'test_research_v1_execution_sufficiency_assessment.py'
      - 'research_v1_execution_sufficiency_cli.py'
      - 'test_research_v1_execution_sufficiency_cli.py'
      - 'INDEXALERT_EXECUTION_EVIDENCE_CONTRACT.md'
      - 'INDEXALERT_LIVE_EXECUTION_PROVENANCE_CONTRACT.md'
      - 'INDEXALERT_EXECUTION_SUFFICIENCY_PROTOCOL.md'
      - 'INDEXALERT_EXECUTION_SUFFICIENCY_PROTOCOL.json'
      - 'INDEXALERT_KIWOOM_REST_READINESS_CONTRACT.md'
      - 'INDEXALERT_BROKER_EXECUTION_CONTRACT.md'
      - 'INDEXALERT_MASTER_SPEC.md'
      - 'INDEXALERT_RESEARCH_STATUS.md'
      - 'INDEXALERT_RESEARCH_LEDGER.md'
      - 'INDEXALERT_CONTINUITY_SNAPSHOT.md'
      - 'test_research_v1_execution_evidence_contract.py'
      - 'test_indexalert_execution_sufficiency_docs.py'
      - 'test_indexalert_kiwoom_rest_readiness_docs.py'
      - '.github/workflows/indexalert-research-v1-execution-evidence.yml'
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 pytest==8.4.2
      - name: Compile and test fail-closed empirical execution evidence stack
        # Covers numerical metric state separately from project empirical/provenance state.
        run: |
          python -m py_compile research_v1_execution_evidence.py research_v1_execution_sufficiency_protocol.py research_v1_execution_sufficiency_assessment.py research_v1_execution_sufficiency_cli.py
          python -m pytest -q test_research_v1_execution_evidence.py test_research_v1_execution_sufficiency_protocol.py test_research_v1_execution_sufficiency_assessment.py test_research_v1_execution_sufficiency_cli.py test_research_v1_execution_evidence_contract.py test_indexalert_execution_sufficiency_docs.py test_indexalert_kiwoom_rest_readiness_docs.py
