name: Probability v3.10 Treasury-yield holdout research
on:
  push:
    branches: [index-alert-server]
    paths:
      - 'probability_v310_treasury_yield.py'
      - '.github/workflows/probability-v310-treasury-yield.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Treasury-yield untouched holdout
        run: |
          python - <<'PY'
          import json,time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import requests
          import next_day_probability as base
          import probability_v310_treasury_yield as research

          raw={}
          metas={}
          for symbol in ('SPY','QQQ','SCHD'):
              rows,meta=base.fetch_history(symbol,time.time())
              raw[symbol]=dict(rows)
              metas[symbol]=meta

          ny=ZoneInfo('America/New_York')
          for symbol in ('^TNX','^FVX','^IRX'):
              u=requests.utils.quote(symbol,safe='')
              r=requests.get(
                  f'https://query1.finance.yahoo.com/v8/finance/chart/{u}',
                  params={'range':'10y','interval':'1d','includePrePost':'false','events':'div,splits'},
                  headers={'User-Agent':'Mozilla/5.0 IndexAlert/3.10'},timeout=20,
              )
              r.raise_for_status()
              result=(r.json().get('chart',{}).get('result') or [None])[0]
              if not result:
                  raise RuntimeError(f'no data {symbol}')
              ts=result.get('timestamp') or []
              closes=(result.get('indicators',{}).get('quote') or [{}])[0].get('close') or []
              rows={}
              for t,c in zip(ts,closes):
                  if c is None or float(c)<=0: continue
                  d=datetime.fromtimestamp(int(t),timezone.utc).astimezone(ny).date().isoformat()
                  rows[d]=float(c)
              raw[symbol]=rows

          common=sorted(set.intersection(*(set(v) for v in raw.values())))
          if len(common)<1800:
              raise RuntimeError(f'aligned history too short: {len(common)}')
          aligned={s:(common,[raw[s][d] for d in common]) for s in raw}
          print('V310_ALIGNMENT',len(common),common[0],common[-1])
          for symbol in ('SPY','QQQ','SCHD'):
              out=research.evaluate(aligned,symbol,metas[symbol]['target_date'])
              print('V310_RESEARCH',symbol,json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
