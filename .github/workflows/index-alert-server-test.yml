name: IndexAlert Server Tests
on:
  push:
    branches: [ index-alert-server, index-alert-shadow-ledger, index-alert-app-milestone, index-alert-monthly-10pct ]
    paths:
      - 'monitor.py'
      - 'production_v30.py'
      - 'production_v31.py'
      - 'production_v32.py'
      - 'execution_evidence_ledger.py'
      - 'krx_readonly_probe.py'
      - 'automation_control.py'
      - 'automation_readiness.py'
      - 'test_automation_readiness.py'
      - 'execution_evidence_readonly_audit.py'
      - 'kiwoom_readonly_configuration_audit.py'
      - 'test_execution_evidence_readonly_audit.py'
      - 'push_receipts.py'
      - 'push_self_test.py'
      - 'push_health.py'
      - 'push_build_registration.py'
      - 'verify_push_physical_e2e.py'
      - 'corporate_action_registry.py'
      - 'laggards.py'
      - 'Dockerfile'
      - 'next_day_probability.py'
      - 'next_day_probability_v31.py'
      - 'one_month_probability.py'
      - 'probability_shadow.py'
      - 'probability_milestone.py'
      - 'test_*.py'
      - 'requirements.txt'
      - '.github/workflows/index-alert-physical-e2e-verify.yml'
      - '.github/workflows/index-alert-server-test.yml'
  pull_request:
    branches: [ index-alert-server ]
    paths:
      - 'automation_control.py'
      - 'automation_readiness.py'
      - 'test_automation_readiness.py'
      - 'test_automation_control.py'
      - 'kiwoom_readonly_configuration_audit.py'
      - 'test_kiwoom_readonly_configuration_audit.py'
      - '.github/workflows/index-alert-server-test.yml'
  workflow_dispatch:
concurrency:
  group: index-alert-server-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt httpx==0.28.1
      - run: python -m py_compile production_v30.py production_v31.py production_v32.py execution_evidence_ledger.py krx_readonly_probe.py automation_control.py execution_evidence_readonly_audit.py kiwoom_readonly_configuration_audit.py automation_readiness.py push_receipts.py push_self_test.py push_health.py push_build_registration.py verify_push_physical_e2e.py corporate_action_registry.py laggards.py
      - run: python -m unittest discover -p 'test_*.py' -v
