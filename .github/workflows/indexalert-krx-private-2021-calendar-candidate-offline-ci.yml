name: IndexAlert KRX Private 2021 Calendar Candidate Offline (No Provider)

on:
  push:
    branches:
      - indexalert-krx-private-2021-calendar-compare-v1-20261017
    paths:
      - 'research_v1_krx_private_2021_calendar_candidate_audit.py'
      - 'test_research_v1_krx_private_2021_calendar_candidate_audit.py'
      - '.github/workflows/indexalert-krx-private-2021-calendar-candidate-offline-ci.yml'
  pull_request:
    paths:
      - 'research_v1_krx_private_2021_calendar_candidate_audit.py'
      - 'test_research_v1_krx_private_2021_calendar_candidate_audit.py'
      - '.github/workflows/indexalert-krx-private-2021-calendar-candidate-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-calendar-offline-only:
    name: 2021 SHA-backed candidate day-set synthetic controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline synthetic private-calendar controls
        run: python -m unittest -v test_research_v1_krx_private_2021_calendar_candidate_audit
      - name: Confirm no private read without --audit flag
        run: |
          python research_v1_krx_private_2021_calendar_candidate_audit.py | python -c '
          import sys,json
          s=sys.stdin.read().strip()
          assert s.startswith("INDEXALERT_2021_PRIVATE_CALENDAR_CANDIDATE_AUDIT=")
          z=json.loads(s.partition("=")[2])
          assert z["status"] == "DRY_RUN_NO_PRIVATE_STORAGE_READ"
          assert z["network_request_attempted"] is False
          assert z["storage_mutated"] is False
          assert z["official_market_status_admitted"] is False
          assert z["ordering"] == "DISABLED"
          '
