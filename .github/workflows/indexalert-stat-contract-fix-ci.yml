name: IndexAlert Statistical Contract Fix Validation

on:
  push:
    branches: [index-alert-stat-contract-fix]

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 requests==2.32.3 pyarrow==21.0.0 scikit-learn==1.7.2 pytest==8.4.2
      - name: Compile changed modules
        run: |
          python -m py_compile research_v1_portfolio.py research_v1_swing_challenger.py
      - name: Run statistical contract tests
        run: |
          python -m pytest -q test_research_v1_portfolio.py test_research_v1_swing_challenger.py test_research_v1_promotion_audit.py
