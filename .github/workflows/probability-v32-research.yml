name: Probability v3.2 regime research
on:
  push:
    branches: [index-alert-probability-v32]
    paths:
      - 'probability_research_v32.py'
      - 'probability_model_v31_runtime.py'
      - 'next_day_probability_v31.py'
      - 'test_probability.py'
      - 'requirements.txt'
      - '.github/workflows/probability-v32-research.yml'
  workflow_dispatch:
concurrency:
  group: probability-v32-research
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Existing probability integrity tests
        run: python -m unittest discover -p test_probability.py -v
      - name: Production 3.1 real-data smoke
        run: |
          python - <<'PY' | tee probability-v31-smoke.txt
          import json, time
          import next_day_probability_v31 as api
          from probability_model_v31_runtime import MODEL_VERSION
          out={}
          for symbol in ('SPY','QQQ','SCHD'):
              r=api.estimate(symbol,time.time())
              out[symbol]={k:r.get(k) for k in ('probability','base_rate','backtest_brier','baseline_brier','backtest_skill','validation_choice','current_strategy','validation_count','nonzero_signal_days','as_of','target_date')}
          print(MODEL_VERSION)
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Conservative v3.2 regime research
        run: python probability_research_v32.py | tee probability-v32-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probability-v32-results
          path: |
            probability-v31-smoke.txt
            probability-v32-result.txt
