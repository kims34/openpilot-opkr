name: KRX Current Permission Boundary

on:
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_krx_permission_reply_evidence.py'
      - 'research_v1_krx_historical_acquisition_rights.py'
      - 'research_v1_krx_historical_acquisition_preflight.py'
      - 'test_research_v1_krx_permission_reply_evidence.py'
      - 'test_research_v1_krx_historical_acquisition_rights.py'
      - 'test_research_v1_krx_historical_acquisition_preflight.py'
      - '.github/workflows/krx-current-permission-boundary.yml'
  push:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_krx_permission_reply_evidence.py'
      - 'research_v1_krx_historical_acquisition_rights.py'
      - '.github/workflows/krx-current-permission-boundary.yml'

permissions:
  contents: read

jobs:
  current-permission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - name: Verify withdrawn rights cannot authorize a bulk request
        run: python -m pytest -q test_research_v1_krx_permission_reply_evidence.py test_research_v1_krx_historical_acquisition_rights.py test_research_v1_krx_historical_acquisition_preflight.py
