name: IndexAlert M20 Original Q3 Fact Cardinality

on:
  pull_request:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_opendart_m20_q3_account_cardinality.py'
      - 'test_research_v1_opendart_m20_q3_account_cardinality.py'
      - '.github/workflows/indexalert-m20-original-q3-cardinality.yml'
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_opendart_m20_q3_account_cardinality.py'
      - 'test_research_v1_opendart_m20_q3_account_cardinality.py'
      - '.github/workflows/indexalert-m20-original-q3-cardinality.yml'

permissions:
  contents: read

jobs:
  offline-candidate-cardinality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 defusedxml==0.7.1
      - run: python -m py_compile research_v1_opendart_m20_q3_account_cardinality.py test_research_v1_opendart_m20_q3_account_cardinality.py
      - run: python -m unittest -v test_research_v1_opendart_m20_q3_account_cardinality.py
      - name: Confirm no KRX/broker route or performance/order authority
        run: |
          ! grep -E 'api.kiwoom.com|data-dbg.krx.co.kr|data.krx.co.kr|/api/dostk/ordr' research_v1_opendart_m20_q3_account_cardinality.py
          grep -F '"historical_pit_source_admitted": False' research_v1_opendart_m20_q3_account_cardinality.py
          grep -F '"performance_run_authorized": False' research_v1_opendart_m20_q3_account_cardinality.py
          grep -F '"real_orders_authorized": False' research_v1_opendart_m20_q3_account_cardinality.py
          grep -F '"ordering": "DISABLED"' research_v1_opendart_m20_q3_account_cardinality.py

  official-readonly-cardinality:
    if: github.event_name == 'push'
    needs: offline-candidate-cardinality
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 defusedxml==0.7.1
      - name: Check preselected original Q3 standalone fact ambiguity without values
        run: |
          python research_v1_opendart_m20_q3_account_cardinality.py
          python -c "import json; p=json.load(open('research_results/opendart_m20_q3_candidate_cardinality/summary.json',encoding='utf8')); assert p['source_status']=='ORIGINAL_CANDIDATE_CARDINALITY_ONLY_NOT_PIT'; assert p['original_reports_inspected']==2; assert p['historical_pit_source_admitted'] is False; assert p['performance_run_authorized'] is False; assert p['real_orders_authorized'] is False"
      - name: Save counts-only diagnostic, no original raw or values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-m20-original-q3-cardinality-counts
          path: research_results/opendart_m20_q3_candidate_cardinality/summary.json
          retention-days: 7
          if-no-files-found: warn
