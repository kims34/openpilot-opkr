name: Holdout Integrity Synthetic Regression
on:
  push:
    branches: [index-alert-holdout-integrity-repair-v1]
    paths: [pit_rebuild/**, .github/workflows/holdout-integrity-synthetic.yml]
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths: [pit_rebuild/**, .github/workflows/holdout-integrity-synthetic.yml]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pit_rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.3.3 scikit-learn==1.7.2
      - name: Synthetic boundary and consumed-window tests
        working-directory: pit_rebuild
        run: python -m unittest -v test_holdout_integrity
