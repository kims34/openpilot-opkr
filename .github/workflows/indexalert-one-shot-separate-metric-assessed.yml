name: IndexAlert one-shot separate metric assessed state

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - '.github/workflows/indexalert-one-shot-separate-metric-assessed.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: index-alert-research-v1
      - name: Separate metric assessment from project empirical assessment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected canonical text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'research_v1_execution_sufficiency_assessment.py',
              '        "empirical_execution_sufficiency_assessed": True,\n',
              '        "execution_metric_sufficiency_assessed": True,\n        "empirical_execution_sufficiency_assessed": False,\n',
          )

          replace_once(
              'test_research_v1_execution_sufficiency_assessment.py',
              '    assert out["empirical_execution_sufficiency_assessed"] is True\n',
              '    assert out["execution_metric_sufficiency_assessed"] is True\n    assert out["empirical_execution_sufficiency_assessed"] is False\n',
          )

          replace_once(
              'test_research_v1_execution_sufficiency_cli.py',
              '    assert saved["execution_metric_gates_passed"] is True\n',
              '    assert saved["execution_metric_gates_passed"] is True\n    assert saved["execution_metric_sufficiency_assessed"] is True\n    assert saved["empirical_execution_sufficiency_assessed"] is False\n',
          )

          replace_once(
              'INDEXALERT_LIVE_EXECUTION_PROVENANCE_CONTRACT.md',
              '- `genuine_live_provenance_verified=false`;\n- `live_empirical_execution_evidence_ready=false`;\n',
              '- `genuine_live_provenance_verified=false`;\n- `execution_metric_sufficiency_assessed=true` may describe only the numerical evaluation that was run;\n- `empirical_execution_sufficiency_assessed=false`;\n- `live_empirical_execution_evidence_ready=false`;\n',
          )

          replace_once(
              'INDEXALERT_EXECUTION_EVIDENCE_CONTRACT.md',
              'Therefore a metric pass by itself must keep:\n- `genuine_live_provenance_verified=false`;\n- `live_empirical_execution_evidence_ready=false`;\n',
              'Therefore a metric pass by itself must keep all project-level empirical state fail-closed:\n- `genuine_live_provenance_verified=false`;\n- `empirical_execution_sufficiency_assessed=false`;\n- `live_empirical_execution_evidence_ready=false`;\n',
          )

          replace_once(
              'INDEXALERT_MASTER_SPEC.md',
              'A numerical pass is reported as `execution_metric_gates_passed=true`; project-level `live_empirical_execution_evidence_ready` and `empirical_execution_blocker_closed` must remain false until the exact evidence bundle also passes independent broker-native provenance admission. This provenance hardening does not change or weaken any frozen v1 numerical threshold.\n',
              'A numerical pass is reported as `execution_metric_gates_passed=true`, and the act of running the numerical evaluator is reported only as `execution_metric_sufficiency_assessed=true`. The project-level `empirical_execution_sufficiency_assessed`, `live_empirical_execution_evidence_ready` and `empirical_execution_blocker_closed` fields must remain false until the exact evidence bundle also passes independent broker-native provenance admission. This provenance hardening does not change or weaken any frozen v1 numerical threshold.\n',
          )

          replace_once(
              'INDEXALERT_RESEARCH_STATUS.md',
              'Numerical success is exposed separately as `execution_metric_gates_passed`; project-level readiness additionally requires independent broker-native provenance admission for the exact evidence bundle. The evaluator keeps `genuine_live_provenance_verified=false`, `live_empirical_execution_evidence_ready=false`, `empirical_execution_blocker_closed=false`, `promotion_ready=false`, `sealed_holdout_authorized=false` and `live_trading_authorized=false` by itself.\n',
              'Numerical success is exposed separately as `execution_metric_gates_passed`, while the fact that the metric calculation was run is `execution_metric_sufficiency_assessed=true`. Project-level readiness additionally requires independent broker-native provenance admission for the exact evidence bundle. The metric evaluator by itself keeps `genuine_live_provenance_verified=false`, `empirical_execution_sufficiency_assessed=false`, `live_empirical_execution_evidence_ready=false`, `empirical_execution_blocker_closed=false`, `promotion_ready=false`, `sealed_holdout_authorized=false` and `live_trading_authorized=false`.\n',
          )

          p = Path('test_indexalert_execution_sufficiency_docs.py')
          text = p.read_text(encoding='utf-8')
          old = '    assert "execution_metric_gates_passed" in master\n'
          new = '    assert "execution_metric_gates_passed" in master\n    assert "execution_metric_sufficiency_assessed=true" in master\n    assert "empirical_execution_sufficiency_assessed=false" in provenance\n'
          if old not in text:
              raise SystemExit('expected doc-drift insertion point not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fail-closed project-state separation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_v1_execution_sufficiency_assessment.py test_research_v1_execution_sufficiency_assessment.py test_research_v1_execution_sufficiency_cli.py INDEXALERT_LIVE_EXECUTION_PROVENANCE_CONTRACT.md INDEXALERT_EXECUTION_EVIDENCE_CONTRACT.md INDEXALERT_MASTER_SPEC.md INDEXALERT_RESEARCH_STATUS.md test_indexalert_execution_sufficiency_docs.py
          git commit -m "Separate metric assessment from project empirical state"
          git push origin HEAD:index-alert-research-v1
