name: IndexAlert Pinned Parallel-Only Offline CI

on:
  push:
    branches:
      - index-alert-backtest-single-runner-opt-v1-20261013
    paths:
      - 'research_v1_runtime_pinned_parallel.py'
      - 'test_research_v1_runtime_pinned_parallel.py'
      - 'research_v1_runtime_archived_source_gate.py'
      - 'test_research_v1_runtime_archived_source_gate.py'
      - '.github/workflows/indexalert-backtest-pinned-parallel-ci.yml'
  pull_request:
    branches:
      - index-alert-backtest-runtime-opt-v1-20261013
    paths:
      - 'research_v1_runtime_pinned_parallel.py'
      - 'test_research_v1_runtime_pinned_parallel.py'
      - 'research_v1_runtime_archived_source_gate.py'
      - 'test_research_v1_runtime_archived_source_gate.py'
      - '.github/workflows/indexalert-backtest-pinned-parallel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-parallel-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-archived-case-parallel-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-indexalert-runtime-ci.txt
      - name: Install same pinned offline test dependencies
        run: python -m pip install -r requirements-indexalert-runtime-ci.txt
      - name: Enforce original CI regression-source blob identities before any test
        run: python research_v1_runtime_archived_source_gate.py
      - name: Fail-closed archived-case and missing-case tampering tests
        run: |
          python -m unittest -q test_research_v1_runtime_ci_integrity
          python -m unittest -q test_research_v1_runtime_pinned_parallel
          python -m unittest -q test_research_v1_runtime_archived_source_gate
      - name: Four disjoint regression suites vs immutable archived 34-case SHA
        run: |
          python research_v1_runtime_pinned_parallel.py --out-dir runtime_opt_results/pinned_parallel
      - name: Upload pinned case parity evidence (NOT performance)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-opt-pinned-parallel-evidence
          path: runtime_opt_results/pinned_parallel/
          if-no-files-found: warn
          retention-days: 14
