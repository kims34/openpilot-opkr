name: IndexAlert Prospective Inputs

on:
  pull_request:
    branches: [index-alert-research-v1, index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_prospective_inputs.py'
      - 'test_research_v1_prospective_inputs.py'
      - '.github/workflows/indexalert-prospective-inputs.yml'
  push:
    branches: [index-alert-research-v1, index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_prospective_inputs.py'
      - 'test_research_v1_prospective_inputs.py'
      - '.github/workflows/indexalert-prospective-inputs.yml'

permissions:
  contents: read

jobs:
  synthetic-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 requests==2.32.3
      - name: Verify label-free inputs and private checkpoint behavior
        run: python -m unittest test_research_v1_prospective_inputs.py
