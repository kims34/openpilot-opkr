name: Probability v3.11b SPY credit-volatility confirmation
on:
  push:
    branches: [index-alert-server]
    paths:
      - 'probability_v311b_credit_confirm.py'
      - '.github/workflows/probability-v311b-credit-confirm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fixed-configuration block robustness
        run: |
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          import requests
          import next_day_probability as base
          import probability_v311b_credit_confirm as confirm

          symbols=('SPY','^VIX','HYG','LQD')
          raw={}; ny=ZoneInfo('America/New_York')
          rows,meta=base.fetch_history('SPY',time.time()); raw['SPY']=dict(rows)
          for symbol in symbols[1:]:
              u=requests.utils.quote(symbol,safe='')
              r=requests.get(f'https://query1.finance.yahoo.com/v8/finance/chart/{u}',params={'range':'10y','interval':'1d','includePrePost':'false','events':'div,splits'},headers={'User-Agent':'Mozilla/5.0 IndexAlert/3.11b'},timeout=20)
              r.raise_for_status(); result=(r.json().get('chart',{}).get('result') or [None])[0]
              ts=result.get('timestamp') or []; closes=(result.get('indicators',{}).get('quote') or [{}])[0].get('close') or []; d={}
              for t,c in zip(ts,closes):
                  if c is None or float(c)<=0: continue
                  day=datetime.fromtimestamp(int(t),timezone.utc).astimezone(ny).date().isoformat(); d[day]=float(c)
              raw[symbol]=d
          common=sorted(set.intersection(*(set(v) for v in raw.values())))
          aligned={s:(common,[raw[s][d] for d in common]) for s in raw}
          out=confirm.evaluate(aligned,meta['target_date'])
          print('V311B_CONFIRM',json.dumps(out,ensure_ascii=False,sort_keys=True))
          if not out['all_blocks_positive']:
              print('V311B_DECISION reject_not_all_blocks_positive')
          else:
              print('V311B_DECISION candidate_for_limited_spy_promotion')
          PY
