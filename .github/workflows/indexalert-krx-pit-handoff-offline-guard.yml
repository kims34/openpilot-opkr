name: IndexAlert KRX Source PIT Handoff Offline Guard

on:
  push:
    branches:
      - indexalert-krx-pit-source-audit-20261013
    paths:
      - 'evidence/krx/2026-10-13-krx-market-source-pit-boundaries.json'
      - 'test_indexalert_krx_market_source_pit_boundaries.py'
      - 'research_v1_krx_calendar_gap_boundary.py'
      - 'test_indexalert_krx_calendar_gap_boundary.py'
      - 'research_v1_krx_calendar_receipt_adapter.py'
      - 'test_indexalert_krx_calendar_receipt_adapter.py'
      - 'research_v1_krx_historical_status_pit_gate.py'
      - 'test_indexalert_krx_historical_status_pit_gate.py'
      - 'research_v1_krx_calendar_count_triage.py'
      - 'test_indexalert_krx_calendar_count_triage.py'
      - 'research_v1_krx_private_date_set_comparator.py'
      - 'test_indexalert_krx_private_date_set_comparator.py'
      - 'evidence/krx/2026-10-14-krx-calendar-count-candidates.json'
      - '.github/workflows/indexalert-krx-pit-handoff-offline-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only-no-network-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sanitized KRX handoff and synthetic calendar gap boundaries; no external calls or secrets
        run: python -m unittest -v test_indexalert_krx_market_source_pit_boundaries.py test_indexalert_krx_calendar_gap_boundary.py test_indexalert_krx_calendar_receipt_adapter.py test_indexalert_krx_historical_status_pit_gate.py test_indexalert_krx_calendar_count_triage.py test_indexalert_krx_private_date_set_comparator.py
