  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 pytest==8.4.2
      - name: Compile and test fail-closed KRX official status and source gates
        run: |
          python -m py_compile research_v1_krx.py test_research_v1_krx_daily_panel_authority.py research_v1_krx_official_status.py research_v1_krx_cleanup_status.py research_v1_krx_source_gates.py research_v1_krx_public_evidence.py research_v1_krx_auth_preflight.py research_v1_krx_authorization_evidence.py research_v1_krx_auth_readiness.py research_v1_krx_status_source_probe.py research_v1_krx_investor_flow_probe.py research_v1_krx_investor_flow_lineage.py research_v1_krx_investor_flow_coverage.py research_v1_krx_status_coverage.py research_v1_krx_status_event_integrity.py research_v1_krx_status_economics.py research_v1_krx_acquisition_receipt.py research_v1_krx_acquisition_batch.py research_v1_krx_source_data_admission.py research_v1_krx_openapi_connectivity_evidence.py research_v1_krx_data_marketplace_route_map.py research_v1_krx_data_marketplace_terms.py research_v1_krx_permission_reply_evidence.py research_v1_krx_historical_acquisition_rights.py research_v1_krx_historical_acquisition_plan.py research_v1_krx_historical_acquisition_preflight.py research_v1_krx_historical_identity.py research_v1_krx_historical_request_planner.py research_v1_krx_historical_execution_contract.py research_v1_krx_private_store.py research_v1_krx_historical_worker_core.py research_v1_krx_data_marketplace_readiness_evidence.py research_v1_krx_status_tiny_probe_evidence.py research_v1_krx_investor_flow_tiny_probe_evidence.py
          python -c "from research_v1_krx_public_evidence import public_evidence_fingerprint_sha256; print('KRX_PUBLIC_EVIDENCE_FINGERPRINT=' + public_evidence_fingerprint_sha256())"
          python -m pytest -q test_research_v1_krx_daily_panel_authority.py test_research_v1_krx_official_status.py test_research_v1_krx_cleanup_status.py test_research_v1_krx_source_gates.py test_research_v1_krx_public_evidence.py test_research_v1_krx_auth_preflight.py test_research_v1_krx_authorization_evidence.py test_research_v1_krx_auth_readiness.py test_research_v1_krx_source_probes.py test_research_v1_krx_probe_workflow_safety.py test_research_v1_krx_investor_flow_lineage.py test_research_v1_krx_investor_flow_coverage.py test_research_v1_krx_status_coverage.py test_research_v1_krx_status_event_integrity.py test_research_v1_krx_status_economics.py test_research_v1_krx_status_economics_contract.py test_research_v1_krx_acquisition_receipt.py test_research_v1_krx_acquisition_batch.py test_research_v1_krx_source_data_admission.py test_research_v1_krx_openapi_connectivity_evidence_validator.py test_research_v1_krx_data_marketplace_route_map.py test_research_v1_krx_data_marketplace_terms.py test_research_v1_krx_permission_reply_evidence.py test_research_v1_krx_historical_acquisition_rights.py test_research_v1_krx_historical_acquisition_plan.py test_research_v1_krx_historical_acquisition_preflight.py test_research_v1_krx_historical_identity.py test_research_v1_krx_historical_request_planner.py test_research_v1_krx_historical_execution_contract.py test_research_v1_krx_private_store.py test_research_v1_krx_historical_worker_core.py test_indexalert_krx_structured_auth_evidence.py test_research_v1_krx_data_marketplace_readiness_evidence.py test_research_v1_krx_status_tiny_probe_evidence.py test_research_v1_krx_investor_flow_tiny_probe_evidence.py test_indexalert_krx_openapi_connectivity_evidence.py test_indexalert_physical_e2e_docs.py
