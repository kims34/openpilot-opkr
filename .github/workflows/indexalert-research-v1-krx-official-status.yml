name: IndexAlert Research v1 Official KRX Status Integrity

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_krx_official_status.py'
      - 'test_research_v1_krx_official_status.py'
      - 'research_v1_krx_cleanup_status.py'
      - 'test_research_v1_krx_cleanup_status.py'
      - 'research_v1_krx_source_gates.py'
      - 'test_research_v1_krx_source_gates.py'
      - 'research_v1_krx_public_evidence.py'
      - 'test_research_v1_krx_public_evidence.py'
      - 'research_v1_krx_auth_preflight.py'
      - 'test_research_v1_krx_auth_preflight.py'
      - 'research_v1_krx_authorization_evidence.py'
      - 'test_research_v1_krx_authorization_evidence.py'
      - 'research_v1_krx_auth_readiness.py'
      - 'test_research_v1_krx_auth_readiness.py'
      - 'research_v1_krx_status_source_probe.py'
      - 'research_v1_krx_investor_flow_probe.py'
      - 'test_research_v1_krx_source_probes.py'
      - 'test_research_v1_krx_probe_workflow_safety.py'
      - 'research_v1_krx_investor_flow_lineage.py'
      - 'test_research_v1_krx_investor_flow_lineage.py'
      - 'research_v1_krx_investor_flow_coverage.py'
      - 'test_research_v1_krx_investor_flow_coverage.py'
      - 'research_v1_krx_status_coverage.py'
      - 'test_research_v1_krx_status_coverage.py'
      - 'research_v1_krx_status_event_integrity.py'
      - 'test_research_v1_krx_status_event_integrity.py'
      - 'research_v1_krx_status_economics.py'
      - 'test_research_v1_krx_status_economics.py'
      - 'INDEXALERT_KRX_STATUS_ECONOMICS_CONTRACT.md'
      - 'test_research_v1_krx_status_economics_contract.py'
      - 'research_v1_krx_acquisition_receipt.py'
      - 'test_research_v1_krx_acquisition_receipt.py'
      - 'research_v1_krx_acquisition_batch.py'
      - 'test_research_v1_krx_acquisition_batch.py'
      - 'research_v1_krx_source_data_admission.py'
      - 'test_research_v1_krx_source_data_admission.py'
      - 'INDEXALERT_KRX_SOURCE_ACCESS_CONTRACT.md'
      - 'INDEXALERT_KRX_SOURCE_GATE_AUDIT.md'
      - 'INDEXALERT_KRX_OPENAPI_CONNECTIVITY_EVIDENCE.md'
      - 'INDEXALERT_KRX_OPENAPI_CONNECTIVITY_EVIDENCE.json'
      - 'test_indexalert_krx_openapi_connectivity_evidence.py'
      - 'INDEXALERT_MASTER_SPEC.md'
      - 'INDEXALERT_RESEARCH_STATUS.md'
      - 'INDEXALERT_CONTINUITY_SNAPSHOT.md'
      - 'INDEXALERT_PHYSICAL_E2E_AUDIT.md'
      - 'test_indexalert_physical_e2e_docs.py'
      - '.github/workflows/indexalert-research-v1-krx-status-source-probe.yml'
      - '.github/workflows/indexalert-research-v1-krx-investor-flow-probe.yml'
      - '.github/workflows/indexalert-research-v1-krx-auth-readiness.yml'
      - '.github/workflows/indexalert-research-v1-krx-official-status.yml'
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 pytest==8.4.2
      - name: Compile and test fail-closed KRX official status and source gates
        run: |
          python -m py_compile research_v1_krx_official_status.py research_v1_krx_cleanup_status.py research_v1_krx_source_gates.py research_v1_krx_public_evidence.py research_v1_krx_auth_preflight.py research_v1_krx_authorization_evidence.py research_v1_krx_auth_readiness.py research_v1_krx_status_source_probe.py research_v1_krx_investor_flow_probe.py research_v1_krx_investor_flow_lineage.py research_v1_krx_investor_flow_coverage.py research_v1_krx_status_coverage.py research_v1_krx_status_event_integrity.py research_v1_krx_status_economics.py research_v1_krx_acquisition_receipt.py research_v1_krx_acquisition_batch.py research_v1_krx_source_data_admission.py test_indexalert_krx_openapi_connectivity_evidence.py test_indexalert_physical_e2e_docs.py
          python -m pytest -q test_research_v1_krx_official_status.py test_research_v1_krx_cleanup_status.py test_research_v1_krx_source_gates.py test_research_v1_krx_public_evidence.py test_research_v1_krx_auth_preflight.py test_research_v1_krx_authorization_evidence.py test_research_v1_krx_auth_readiness.py test_research_v1_krx_source_probes.py test_research_v1_krx_probe_workflow_safety.py test_research_v1_krx_investor_flow_lineage.py test_research_v1_krx_investor_flow_coverage.py test_research_v1_krx_status_coverage.py test_research_v1_krx_status_event_integrity.py test_research_v1_krx_status_economics.py test_research_v1_krx_status_economics_contract.py test_research_v1_krx_acquisition_receipt.py test_research_v1_krx_acquisition_batch.py test_research_v1_krx_source_data_admission.py test_indexalert_krx_openapi_connectivity_evidence.py test_indexalert_physical_e2e_docs.py
