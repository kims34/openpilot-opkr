name: IndexAlert Dynamic 0-N Challenger
# Developmental H5 history cannot be automatically re-evaluated on every
# diagnostic edit: such runs are not independent holdout or successor alpha.
on:
  pull_request:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_dynamic_0n_challenger.py'
      - 'research_v1_dynamic_0n_rank_diagnostics.py'
      - 'test_research_v1_dynamic_0n_rank_diagnostics.py'
      - '.github/workflows/indexalert-dynamic-0n-challenger.yml'
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_dynamic_0n_challenger.py'
      - 'research_v1_dynamic_0n_rank_diagnostics.py'
      - 'test_research_v1_dynamic_0n_rank_diagnostics.py'
      - '.github/workflows/indexalert-dynamic-0n-challenger.yml'
  workflow_dispatch:
jobs:
  offline-rank-diagnostic-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal diagnostic dependencies
        run: pip install pandas==2.3.3 numpy==2.3.3
      - name: Guard missing-outcome rank invariance without market data
        run: |
          python -m py_compile research_v1_dynamic_0n_challenger.py research_v1_dynamic_0n_rank_diagnostics.py test_research_v1_dynamic_0n_rank_diagnostics.py
          python -m unittest -v test_research_v1_dynamic_0n_rank_diagnostics
      - name: Source-only frozen strategy guard
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("research_v1_dynamic_0n_challenger.py").read_text()
          assert "from research_v1_dynamic_0n_rank_diagnostics import rank_diagnostics" in source
          assert "def rank_diagnostics(" not in source
          assert "train_days=504,cal_days=126,test_days=126,purge_days=5" in source
          assert '"sealed_holdout_touched":False' in source
          PY
  dynamic-0n:
    # DO NOT spend fresh historical labels / cached backtests on code pushes.
    # This manual job is developmental only; never interpret as holdout PASS.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 requests==2.32.3 pyarrow==21.0.0 scikit-learn==1.7.2
      - name: Frozen integrity
        run: |
          python -m py_compile research_v1_dynamic_0n_challenger.py
          python -m unittest test_research_v1_distributional_netev.py test_research_v1_market_eligibility.py test_research_v1_corporate_action_returns.py test_research_v1_pit_tax.py test_research_v1_supervised_cache.py
      - name: Restore long-history source
        uses: actions/cache@v4
        with:
          path: research_data/marcap_raw_long
          key: marcap-long-v1-2015-06-15-2026-09-28
      - name: Restore frozen supervised PIT labels
        uses: actions/cache@v4
        with:
          path: research_data/pit_supervised_long_v3_ca_fp
          key: pit-supervised-long-v3-ca-fp-2015-06-15-2026-09-28-h5-c3
      - name: Build identical PIT panel
        run: python research_v1_marcap.py --start 2015-06-15 --end 2026-09-28 --out research_data/marcap_kospi_pit_long --raw research_data/marcap_raw_long
      - name: Run Dynamic 0-N diagnostic
        run: python research_v1_dynamic_0n_challenger.py --cache research_data/marcap_kospi_pit_long --supervised-cache research_data/pit_supervised_long_v3_ca_fp --result-dir research_results/dynamic_0n_challenger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexalert-dynamic-0n-challenger
          path: research_results/dynamic_0n_challenger/
          retention-days: 30
