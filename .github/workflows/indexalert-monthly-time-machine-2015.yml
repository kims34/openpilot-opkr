name: IndexAlert time-machine Jan 2015 monthly probability replay
on:
  push:
    branches: [indexalert-monthly-time-machine-2015-20261116]
    paths:
      - research_monthly_time_machine_2015.py
      - .github/workflows/indexalert-monthly-time-machine-2015.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-exact-asof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        symbol: [SPY, QQQ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies with no live broker permissions
        run: python -m pip install numpy==2.3.3 pandas==2.3.3 exchange-calendars==4.13.2 requests==2.32.3
      - name: Rewind to Jan 2 2015 and score February + rest of year
        run: |
          python -m py_compile research_monthly_time_machine_2015.py
          python research_monthly_time_machine_2015.py --symbol ${{ matrix.symbol }} --as-of 2015-01-02
