name: KRX source admission exact authority flags
on:
  pull_request:
    branches: [index-alert-position-regen-fix-v1, index-alert-research-v1]
    paths: [research_v1_krx_acquisition_batch.py, test_research_v1_krx_acquisition_batch.py, research_v1_krx_source_data_admission.py, test_research_v1_krx_source_data_admission.py, .github/workflows/indexalert-source-admission-types.yml]
  push:
    branches: [index-alert-position-regen-fix-v1, index-alert-research-v1]
    paths: [research_v1_krx_acquisition_batch.py, test_research_v1_krx_acquisition_batch.py, research_v1_krx_source_data_admission.py, test_research_v1_krx_source_data_admission.py, .github/workflows/indexalert-source-admission-types.yml]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.3.3 pytest==8.4.2
      - run: python -m pytest -q test_research_v1_krx_source_data_admission.py test_research_v1_krx_acquisition_batch.py
