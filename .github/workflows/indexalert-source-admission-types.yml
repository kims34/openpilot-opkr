permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.3.3 pytest==8.4.2
      - run: python -m pytest -q test_research_v1_krx_source_gates.py test_research_v1_krx_expected_scope_executor.py test_research_v1_krx_historical_fetchers.py test_research_v1_krx_expected_scope_batch.py test_research_v1_krx_expected_scope_materializer.py test_research_v1_krx_expected_scope_attestation.py test_research_v1_krx_coverage_pit_review.py test_research_v1_krx_authorization_evidence.py test_research_v1_krx_investor_flow_lineage.py test_research_v1_krx_investor_flow_coverage.py test_research_v1_krx_acquisition_receipt.py test_research_v1_krx_source_data_admission.py test_research_v1_krx_acquisition_batch.py
