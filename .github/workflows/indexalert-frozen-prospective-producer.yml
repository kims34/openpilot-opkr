name: IndexAlert Frozen Prospective Producer

on:
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_prospective_frozen_producer.py'
      - 'test_research_v1_prospective_frozen_producer.py'
      - 'research_v1_prospective_model_bundle.py'
      - 'research_v1_prospective_decision_capture.py'
      - 'test_research_v1_prospective_decision_capture.py'
      - 'INDEXALERT_FROZEN_PROSPECTIVE_PRODUCER_2026-10-08.md'
      - '.github/workflows/indexalert-frozen-prospective-producer.yml'
  push:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_prospective_frozen_producer.py'
      - 'test_research_v1_prospective_frozen_producer.py'
      - 'research_v1_prospective_model_bundle.py'
      - 'research_v1_prospective_decision_capture.py'
      - 'test_research_v1_prospective_decision_capture.py'
      - 'INDEXALERT_FROZEN_PROSPECTIVE_PRODUCER_2026-10-08.md'
      - '.github/workflows/indexalert-frozen-prospective-producer.yml'

permissions:
  contents: read

jobs:
  frozen-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install synthetic-test dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0
      - name: Verify exact freeze-anchor producer schedule
        run: python -m unittest test_research_v1_prospective_model_bundle.py test_research_v1_prospective_frozen_producer.py test_research_v1_prospective_decision_capture.py
