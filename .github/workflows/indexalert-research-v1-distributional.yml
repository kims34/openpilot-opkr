name: IndexAlert Research v1 Distributional NetEV

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'INDEXALERT_MASTER_SPEC.md'
      - 'research_v1_distributional_netev.py'
      - 'research_v1_distributional_ablation.py'
      - 'research_v1_distributional_recency.py'
      - 'research_v1_pit_features.py'
      - 'research_v1_pit_labels.py'
      - 'research_v1_marcap.py'
      - 'test_research_v1_distributional_netev.py'
      - 'test_research_v1_corporate_action_returns.py'
      - 'test_research_v1_pit_tax.py'
      - 'research_v1_supervised_cache.py'
      - 'research_v1_fixed_horizon_label.py'
      - 'research_v1_context.py'
      - '.github/workflows/indexalert-research-v1-distributional.yml'
  workflow_dispatch:

jobs:
  distributional-netev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 requests==2.32.3 pyarrow==21.0.0 scikit-learn==1.7.2
      - name: Compile and run integrity tests
        run: |
          python -m py_compile research_v1_distributional_netev.py research_v1_distributional_ablation.py research_v1_distributional_recency.py research_v1_pit_features.py research_v1_pit_labels.py research_v1_fixed_horizon_label.py
          python -m unittest test_research_v1_distributional_netev.py test_research_v1_corporate_action_returns.py test_research_v1_pit_tax.py
      - name: Restore marcap source
        uses: actions/cache@v4
        with:
          path: research_data/marcap_raw
          key: marcap-fast-v1-2024-01-01-2026-09-28
          restore-keys: |
            marcap-pit-v2-
            marcap-pit-v1-
      - name: Restore corporate-action-safe supervised PIT labels
        uses: actions/cache@v4
        with:
          path: research_data/pit_supervised_v2_ca
          key: pit-supervised-v2-ca-2024-01-01-2026-09-28-h5-c3
      - name: Build PIT panel v3
        run: |
          python research_v1_marcap.py --start 2024-01-01 --end 2026-09-28 --out research_data/marcap_kospi_pit --raw research_data/marcap_raw
      - name: Run corporate-action-safe distributional executable NetEV
        run: |
          python research_v1_distributional_netev.py --cache research_data/marcap_kospi_pit --supervised-cache research_data/pit_supervised_v2_ca --result-dir research_results/marcap_pit_distributional --horizon 5 --top-k 3 --train-days 160 --cal-days 40 --test-days 40
          cat research_results/marcap_pit_distributional/summary.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-research-v1-distributional-netev
          path: research_results/marcap_pit_distributional/
          if-no-files-found: warn
          retention-days: 30
