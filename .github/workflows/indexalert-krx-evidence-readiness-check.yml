name: IndexAlert KRX Evidence Readiness Check

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - '.github/workflows/indexalert-krx-evidence-readiness-check.yml'
      - 'INDEXALERT_KRX_AUTH_EVIDENCE_SECURITY_STATUS.json'
      - 'INDEXALERT_KRX_AUTH_EVIDENCE_INVESTOR_FLOW.json'
      - 'research_v1_krx_auth_readiness.py'
      - 'research_v1_krx_authorization_evidence.py'
      - 'research_v1_krx_auth_preflight.py'

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - family: KRX_SECURITY_STATUS
            evidence_file: INDEXALERT_KRX_AUTH_EVIDENCE_SECURITY_STATUS.json
          - family: KRX_INVESTOR_FLOW
            evidence_file: INDEXALERT_KRX_AUTH_EVIDENCE_INVESTOR_FLOW.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify network-free readiness with committed permission evidence
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          KRX_OPENAPI_AUTH_KEY: ''
          KRX_READINESS_SOURCE_FAMILY: ${{ matrix.family }}
          KRX_EXPLICIT_PROBE_CONSENT: ''
          EVIDENCE_FILE: ${{ matrix.evidence_file }}
        run: |
          export KRX_AUTH_EVIDENCE_JSON="$(cat "${EVIDENCE_FILE}")"
          export KRX_AUTH_EVIDENCE_REF="$(python -c 'import json,os; print(json.load(open(os.environ["EVIDENCE_FILE"], encoding="utf-8"))["evidence_reference"])')"
          python research_v1_krx_auth_readiness.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research_results/krx_auth_readiness/summary.json").read_text(encoding="utf-8"))
          safe={
              "source_family":d["source_family"],
              "krx_id_present":d["krx_id_present"],
              "krx_pw_present":d["krx_pw_present"],
              "route_credentials_complete":d["route_credentials_complete"],
              "authorization_evidence_reference_present":d["authorization_evidence_reference_present"],
              "authorization_evidence_valid_for_declared_tiny_probe":d["authorization_evidence"]["valid_for_declared_tiny_probe"],
              "automated_collection_authorized":d["authorization_evidence"].get("automated_collection_authorized"),
              "configuration_ready_for_manual_authenticated_probe":d["configuration_ready_for_manual_authenticated_probe"],
              "request_attempt_authorized":d["request_attempt_authorized"],
              "network_request_attempted":d["network_request_attempted"],
              "remaining_requirements_before_manual_probe":d["remaining_requirements_before_manual_probe"],
              "sealed_holdout_authorized":d["sealed_holdout_authorized"],
              "live_trading_authorized":d["live_trading_authorized"],
          }
          print("SAFE_READINESS="+json.dumps(safe, ensure_ascii=False))
          assert d["krx_id_present"] is True
          assert d["krx_pw_present"] is True
          assert d["route_credentials_complete"] is True
          assert d["authorization_evidence_reference_present"] is True
          assert d["authorization_evidence"]["valid_for_declared_tiny_probe"] is True
          assert d["authorization_evidence"].get("automated_collection_authorized") is True
          assert d["configuration_ready_for_manual_authenticated_probe"] is True
          assert d["request_attempt_authorized"] is False
          assert d["network_request_attempted"] is False
          assert d["remaining_requirements_before_manual_probe"] == ["EXPLICIT_TINY_REQUEST_CONSENT"]
          assert d["sealed_holdout_authorized"] is False
          assert d["live_trading_authorized"] is False
          PY
