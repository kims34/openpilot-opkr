name: IndexAlert Research v1 Exit Policy Compare

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_exit_policy_compare.py'
      - 'research_v1_exit_policy_compare_fast.py'
      - 'test_research_v1_exit_policy_compare.py'
      - 'research_v1_core.py'
      - 'research_v1_distributional_netev.py'
      - 'research_v1_fixed_horizon_label.py'
      - 'research_v1_pit_features.py'
      - 'research_v1_pit_labels.py'
      - 'research_v1_supervised_cache.py'
      - 'research_v1_context.py'
      - 'research_v1_marcap.py'
      - '.github/workflows/indexalert-research-v1-exit-policy-compare.yml'
  workflow_dispatch:

jobs:
  short-history:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 requests==2.32.3 pyarrow==21.0.0 scikit-learn==1.7.2
      - name: Compile and test exit policy integrity
        run: |
          python -m py_compile research_v1_exit_policy_compare.py research_v1_exit_policy_compare_fast.py research_v1_core.py research_v1_fixed_horizon_label.py
          python -m unittest test_research_v1_exit_policy_compare.py test_research_v1_corporate_action_returns.py test_research_v1_pit_tax.py
      - name: Restore short marcap source
        uses: actions/cache@v4
        with:
          path: research_data/marcap_raw
          key: marcap-fast-v1-2024-01-01-2026-09-28
          restore-keys: |
            marcap-pit-v2-
            marcap-pit-v1-
      - name: Restore short CA-safe supervised cache
        uses: actions/cache@v4
        with:
          path: research_data/pit_supervised_v2_ca
          key: pit-supervised-v2-ca-2024-01-01-2026-09-28-h5-c3
      - name: Build short PIT panel v3
        run: |
          python research_v1_marcap.py --start 2024-01-01 --end 2026-09-28 --out research_data/marcap_kospi_pit --raw research_data/marcap_raw
      - name: Run short exit-policy comparison
        run: |
          python research_v1_exit_policy_compare_fast.py --cache research_data/marcap_kospi_pit --supervised-cache research_data/pit_supervised_v2_ca --result-dir research_results/exit_policy_short --horizon 5 --top-k 3 --target 0.04 --stop=-0.025 --train-days 160 --cal-days 40 --test-days 40
          cat research_results/exit_policy_short/summary.json
      - name: Upload short result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-exit-policy-short
          path: research_results/exit_policy_short/
          if-no-files-found: warn
          retention-days: 30

  long-history:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 requests==2.32.3 pyarrow==21.0.0 scikit-learn==1.7.2
      - name: Compile and test exit policy integrity
        run: |
          python -m py_compile research_v1_exit_policy_compare.py research_v1_exit_policy_compare_fast.py research_v1_core.py research_v1_fixed_horizon_label.py
          python -m unittest test_research_v1_exit_policy_compare.py test_research_v1_corporate_action_returns.py test_research_v1_pit_tax.py
      - name: Restore long marcap source
        uses: actions/cache@v4
        with:
          path: research_data/marcap_raw_long
          key: marcap-long-v1-2015-06-15-2026-09-28
      - name: Restore long CA-safe supervised cache
        uses: actions/cache@v4
        with:
          path: research_data/pit_supervised_long_v2_ca
          key: pit-supervised-long-v2-ca-2015-06-15-2026-09-28-h5-c3
      - name: Build long PIT panel v3
        run: |
          python research_v1_marcap.py --start 2015-06-15 --end 2026-09-28 --out research_data/marcap_kospi_pit_long --raw research_data/marcap_raw_long
      - name: Run long exit-policy comparison
        run: |
          python research_v1_exit_policy_compare_fast.py --cache research_data/marcap_kospi_pit_long --supervised-cache research_data/pit_supervised_long_v2_ca --result-dir research_results/exit_policy_long --horizon 5 --top-k 3 --target 0.04 --stop=-0.025 --train-days 504 --cal-days 126 --test-days 126
          cat research_results/exit_policy_long/summary.json
      - name: Upload long result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-exit-policy-long
          path: research_results/exit_policy_long/
          if-no-files-found: warn
          retention-days: 30
