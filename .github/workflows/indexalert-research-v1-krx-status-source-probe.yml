name: IndexAlert Research v1 KRX Status Source Probe

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_krx_status_source_probe.py'
      - 'research_v1_krx_source_gates.py'
      - '.github/workflows/indexalert-research-v1-krx-status-source-probe.yml'
  workflow_dispatch:

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      KRX_OPENAPI_AUTH_KEY: ${{ secrets.KRX_OPENAPI_AUTH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pinned KRX source client
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 requests==2.32.3 python-dotenv
          pip install 'git+https://github.com/beaten-by-the-market/krx-data-api.git@e6ebac9b71482db127348d8a08ebc6743aa3b50e'
      - name: Run metadata-only status source diagnostic with A-F audit
        run: |
          python -m py_compile research_v1_krx_source_gates.py research_v1_krx_status_source_probe.py
          python research_v1_krx_status_source_probe.py
          cat research_results/krx_status_source_probe/summary.json
      - name: Upload metadata-only source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-research-v1-krx-status-source-probe
          path: research_results/krx_status_source_probe/summary.json
          if-no-files-found: warn
          retention-days: 14
