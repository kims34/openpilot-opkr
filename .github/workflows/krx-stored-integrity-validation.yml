name: KRX stored integrity validation
on:
  push:
    branches: [index-alert-krx-stored-integrity-validation-v1, index-alert-position-regen-fix-v1]
    paths: [research_v1_krx_readonly_integrity_audit.py, test_research_v1_krx_readonly_integrity_audit.py, .github/workflows/krx-stored-integrity-validation.yml]
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths: [research_v1_krx_readonly_integrity_audit.py, test_research_v1_krx_readonly_integrity_audit.py, .github/workflows/krx-stored-integrity-validation.yml]
permissions:
  contents: read
jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_research_v1_krx_readonly_integrity_audit -v
