name: IndexAlert Physical E2E Receipt Reverify 4491bcee

on:
  push:
    branches: [ index-alert-server-physical-e2e-reverify-4491bcee ]
    paths:
      - '.github/workflows/index-alert-physical-e2e-verify.yml'
      - 'verify_push_physical_e2e.py'
      - 'push_health.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verifier dependency
        run: pip install requests==2.32.3
      - name: Verify existing real-handset receipt evidence on current production
        run: |
          python -m py_compile verify_push_physical_e2e.py
          python verify_push_physical_e2e.py \
            --base-url 'https://indexalert-runtime-production.up.railway.app' \
            --expected-build '4.7-47' \
            --output physical_e2e_verification.json
      - name: Upload read-only verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-physical-e2e-4.7-47-reverify-4491bcee
          path: physical_e2e_verification.json
          if-no-files-found: warn
          retention-days: 30
