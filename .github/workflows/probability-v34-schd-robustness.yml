name: Probability v3.4 SCHD robustness
on:
  push:
    branches: [index-alert-probability-v34-research]
    paths:
      - 'probability_research_v34c.py'
      - 'probability_research_v34d.py'
      - '.github/workflows/probability-v34-schd-robustness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run frozen SCHD challenger robustness audit
        run: python probability_research_v34d.py | tee probability-v34d-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: probability-v34d-result
          path: probability-v34d-result.json
