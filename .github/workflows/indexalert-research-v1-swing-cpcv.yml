name: IndexAlert Research v1 Short-Swing Purged CPCV

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_swing_cpcv.py'
      - 'test_research_v1_swing_cpcv.py'
      - 'research_v1_swing_challenger.py'
      - 'test_research_v1_swing_challenger.py'
      - 'research_v1_short_swing_compare.py'
      - 'test_research_v1_short_swing_compare.py'
      - 'research_v1_selected_calibration.py'
      - 'research_v1_distributional_long_history.py'
      - 'research_v1_distributional_netev.py'
      - 'research_v1_market_eligibility.py'
      - 'research_v1_fixed_horizon_label.py'
      - 'research_v1_supervised_cache.py'
      - 'research_v1_pit_features.py'
      - 'research_v1_pit_labels.py'
      - '.github/workflows/indexalert-research-v1-swing-cpcv.yml'
  workflow_dispatch:

jobs:
  purged-cpcv:
    strategy:
      fail-fast: false
      matrix:
        horizon: [5, 10]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 requests==2.32.3 pyarrow==21.0.0 scikit-learn==1.7.2

      - name: Compile and run CPCV integrity tests
        run: |
          python -m py_compile \
            research_v1_swing_cpcv.py \
            research_v1_swing_challenger.py \
            research_v1_selected_calibration.py \
            research_v1_distributional_netev.py
          python -m unittest \
            test_research_v1_swing_cpcv.py \
            test_research_v1_swing_challenger.py \
            test_research_v1_short_swing_compare.py \
            test_research_v1_market_eligibility.py \
            test_research_v1_corporate_action_returns.py \
            test_research_v1_pit_tax.py \
            test_research_v1_supervised_cache.py

      - name: Restore long-history marcap source
        uses: actions/cache@v4
        with:
          path: research_data/marcap_raw_long
          key: marcap-long-v1-2015-06-15-2026-09-28

      - name: Restore horizon-specific CA-safe supervised cache
        uses: actions/cache@v4
        with:
          path: research_data/pit_supervised_cpcv_h${{ matrix.horizon }}_v1_ca_fp
          key: pit-supervised-cpcv-v1-ca-fp-2015-06-15-2026-09-28-h${{ matrix.horizon }}-c1

      - name: Build long PIT panel v3
        run: |
          python research_v1_marcap.py \
            --start 2015-06-15 \
            --end 2026-09-28 \
            --out research_data/marcap_kospi_pit_long \
            --raw research_data/marcap_raw_long

      - name: Run purged CPCV H${{ matrix.horizon }}
        run: |
          python research_v1_swing_cpcv.py \
            --cache research_data/marcap_kospi_pit_long \
            --supervised-cache research_data/pit_supervised_cpcv_h${{ matrix.horizon }}_v1_ca_fp \
            --result-dir research_results/cpcv_h${{ matrix.horizon }} \
            --horizon ${{ matrix.horizon }}
          cat research_results/cpcv_h${{ matrix.horizon }}/summary.json

      - name: Upload purged CPCV H${{ matrix.horizon }} result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-research-v1-cpcv-h${{ matrix.horizon }}
          path: research_results/cpcv_h${{ matrix.horizon }}/
          if-no-files-found: warn
          retention-days: 30

