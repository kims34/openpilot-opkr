name: IndexAlert M20 Original DART Viewer TOC Independent Source
on:
  push:
    branches: [indexalert-m20-opendart-original-proof-20261013]
    paths:
      - 'research_v1_opendart_m20_2022_first_viewer_toc.py'
      - 'test_research_v1_opendart_m20_2022_first_viewer_toc.py'
      - '.github/workflows/indexalert-m20-2022-first-viewer-toc.yml'
permissions:
  contents: read
concurrency:
  group: m20-first-viewer-toc-2022
  cancel-in-progress: false
jobs:
  offline-viewer-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3 defusedxml==0.7.1
      - name: Verify first-edition viewer TOC parsing and strict safety
        run: |
          python -m py_compile research_v1_opendart_m20_2022_first_viewer_toc.py test_research_v1_opendart_m20_2022_first_viewer_toc.py
          python -m unittest -v test_research_v1_opendart_m20_2022_first_viewer_toc
      - name: Check no broker/market APIs or trade enablement
        run: |
          ! grep -E 'api.kiwoom.com|data.krx.co.kr|data-dbg.krx.co.kr|/api/dostk/ordr' research_v1_opendart_m20_2022_first_viewer_toc.py
          grep -F '"m20_performance_run_authorized": False' research_v1_opendart_m20_2022_first_viewer_toc.py
          grep -F '"ordering": "DISABLED"' research_v1_opendart_m20_2022_first_viewer_toc.py
  official-fixed-first-viewer-toc:
    needs: offline-viewer-safety
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3 defusedxml==0.7.1
      - name: Inspect only first-submitted original DART viewer TOC metadata
        run: |
          python research_v1_opendart_m20_2022_first_viewer_toc.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("research_results/opendart_m20_2022_first_viewer_toc/counts.json").read_text())
          assert x["credential_present"] is True
          assert x["fixed_cohort_slot"] == 5
          assert x["max_official_api_calls"] == 2
          assert x["max_public_viewer_calls"] == 1
          assert x["source_status"] in (
              "FIRST_RECEIPT_VIEWER_TOC_METADATA_ONLY",
              "FIRST_RECEIPT_VIEWER_SINGLE_DOC_METADATA_ONLY",
          ), "VIEWER_NOT_VERIFIED"
          assert x["matched_first_receipt_toc_entries"] + x["matched_first_receipt_single_viewdoc_entries"] >= 1
          assert x["toc_structured_first_original_cfs_section_proven"] is False
          assert x["ordering"] == "DISABLED"
          for key in ("viewer_is_original_vintage_financial_proof",
                      "viewer_toc_is_official_sgml_xsd_schema_proof",
                      "viewer_toc_is_first_publication_instant_proof",
                      "verified_original_2022_q3_cfs_profit",
                      "verified_original_2021_q3_3month_comparator",
                      "historical_issuer_security_pit_verified",
                      "complete_original_to_correction_cell_lineage",
                      "m20_feature_pit_admitted", "m20_performance_run_authorized",
                      "independent_holdout_authorized", "champion_change_authorized",
                      "real_orders_authorized", "funds_movement_authorized",
                      "permissions_change_authorized",
                      "provider_response_html_titles_urls_ids_saved"):
              assert x[key] is False,key
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m20-first-2022-public-viewer-toc-counts-only
          path: research_results/opendart_m20_2022_first_viewer_toc/counts.json
          retention-days: 7
          if-no-files-found: warn
