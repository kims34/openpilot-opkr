name: Monthly probability history research
on:
  push:
    branches: [index-alert-server]
    paths:
      - 'one_month_window_research.py'
      - '.github/workflows/monthly-history-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python one_month_window_research.py
