name: Apply IndexAlert v3.9 probability UI patch
on:
  push:
    branches: [ index-alert-build ]
    paths:
      - 'index-alert/patch_v39_ui.py'
      - '.github/workflows/index-alert-v39-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: index-alert-build
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply UI patch
        run: python index-alert/patch_v39_ui.py
      - name: Commit patched app and remove one-shot patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm index-alert/patch_v39_ui.py .github/workflows/index-alert-v39-ui-patch.yml
          git add index-alert/app
          git commit -m "Collapse probability sections and use black probability numbers"
          git push origin HEAD:index-alert-build
