name: IndexAlert M20 Five Additional Original Q3 Earnings Pairs

on:
  pull_request:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_opendart_m20_extra_original_q3_pairs.py'
      - 'test_research_v1_opendart_m20_extra_original_q3_pairs.py'
      - '.github/workflows/indexalert-m20-extra-original-q3-pairs.yml'
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_opendart_m20_extra_original_q3_pairs.py'
      - 'test_research_v1_opendart_m20_extra_original_q3_pairs.py'
      - '.github/workflows/indexalert-m20-extra-original-q3-pairs.yml'

permissions:
  contents: read

concurrency:
  group: indexalert-m20-extra-original-q3-sources
  cancel-in-progress: false

jobs:
  offline-strict-source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 defusedxml==0.7.1
      - name: Synthetic original issuer pairs without source requests
        run: |
          python -m py_compile research_v1_opendart_m20_extra_original_q3_pairs.py test_research_v1_opendart_m20_extra_original_q3_pairs.py
          python -m unittest -v test_research_v1_opendart_m20_extra_original_q3_pairs.py
      - name: No extra KRX or broker endpoints, no PIB/holdout/order promotion
        run: |
          ! grep -E 'api.kiwoom.com|data-dbg.krx.co.kr|data.krx.co.kr|/api/dostk/ordr' research_v1_opendart_m20_extra_original_q3_pairs.py
          grep -F '"m20_performance_run_authorized":False' research_v1_opendart_m20_extra_original_q3_pairs.py
          grep -F '"real_orders_authorized":False' research_v1_opendart_m20_extra_original_q3_pairs.py
          grep -F '"ordering":"DISABLED"' research_v1_opendart_m20_extra_original_q3_pairs.py

  five-scoped-original-issuer-pairs:
    if: github.event_name == 'push'
    needs: offline-strict-source-safety
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cohort_slot: [0, 1, 3, 4, 5]
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 defusedxml==0.7.1
      - name: Two original first-filed XBRL documents, numeric shape only
        run: |
          python research_v1_opendart_m20_extra_original_q3_pairs.py --cohort-slot ${{ matrix.cohort_slot }}
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research_results/opendart_m20_original_extra_issuer_q3_pairs/slot_${{ matrix.cohort_slot }}.json').read_text(encoding='utf8'))
          for key in ('historical_issuer_mapping_verified','original_filing_historical_publication_pit_verified',
                      'm20_signal_pit_admitted','m20_performance_run_authorized',
                      'independent_holdout_authorized','champion_change_authorized',
                      'real_orders_authorized','funds_movement_authorized',
                      'permissions_change_authorized','raw_earnings_filing_or_issuer_ids_saved'):
              assert p[key] is False, 'UNEXPECTED_SOURCE_OR_TRADING_AUTHORITY'
          assert p['ordering']=='DISABLED'
          assert p['cohort_slot']==${{ matrix.cohort_slot }}
          assert p['source_status'] in (
              'ONE_NEW_ISSUER_ORIGINAL_Q3_NUMERIC_REPRESENTATION_SHAPE_ONLY',
              'SOURCE_GAP_FAIL_CLOSED'
          ), 'SOURCE_AUTH_OR_SCOPE_NOT_READY'
          PY
      - name: Original value and receipt-free Boolean source report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-m20-original-q3-slot-${{ matrix.cohort_slot }}-flags-only
          path: research_results/opendart_m20_original_extra_issuer_q3_pairs/slot_${{ matrix.cohort_slot }}.json
          retention-days: 7
          if-no-files-found: warn
