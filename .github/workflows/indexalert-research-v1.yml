name: IndexAlert Research v1

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_core.py'
      - 'research_v1_krx.py'
      - 'research_v1_public.py'
      - 'run_research_v1.py'
      - 'test_research_v1_core.py'
      - '.github/workflows/indexalert-research-v1.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 'Research start (YYYY-MM-DD)'
        required: false
        default: '2025-01-01'
      end:
        description: 'Research end (YYYY-MM-DD)'
        required: false
        default: '2026-09-28'
      universe_size:
        description: 'Current KOSPI large-cap smoke universe size'
        required: false
        default: '50'

jobs:
  smoke-test-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pandas numpy

      - name: Unit tests
        run: pytest -q test_research_v1_core.py

      - name: Build public real-price smoke panel
        env:
          START_DATE: ${{ github.event.inputs.start || '2025-01-01' }}
          END_DATE: ${{ github.event.inputs.end || '2026-09-28' }}
          UNIVERSE_SIZE: ${{ github.event.inputs.universe_size || '50' }}
        run: |
          python research_v1_public.py --start "$START_DATE" --end "$END_DATE" --universe-size "$UNIVERSE_SIZE" --sleep 0.10

      - name: Run provisional Baseline Judge plumbing
        run: |
          python run_research_v1.py --cache research_data/public_smoke_daily --result-dir research_results/public_smoke --top-k 3 --horizon 5 --target 0.04 --stop -0.025 --participation 0.0005

      - name: Show smoke summary and limitations
        if: always()
        run: |
          test -f research_results/public_smoke/summary.json && cat research_results/public_smoke/summary.json || true
          test -f research_data/public_smoke_daily/build_stats.json && cat research_data/public_smoke_daily/build_stats.json || true
          test -f research_data/public_smoke_daily/limitations.json && cat research_data/public_smoke_daily/limitations.json || true
          test -f research_data/public_smoke_daily/failures.json && cat research_data/public_smoke_daily/failures.json || true

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-research-v1-public-smoke-results
          path: |
            research_results/public_smoke/
            research_data/public_smoke_daily/build_stats.json
            research_data/public_smoke_daily/limitations.json
            research_data/public_smoke_daily/universe.json
            research_data/public_smoke_daily/failures.json
          if-no-files-found: warn
          retention-days: 30
