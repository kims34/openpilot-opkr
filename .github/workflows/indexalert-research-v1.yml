name: IndexAlert Research v1

on:
  push:
    branches: [index-alert-research-v1]
    paths:
      - 'research_v1_core.py'
      - 'research_v1_portfolio.py'
      - 'research_v1_data_policy.py'
      - 'research_v1_krx.py'
      - 'research_v1_public.py'
      - 'research_v1_marcap.py'
      - 'research_v1_ml.py'
      - 'research_v1_selective.py'
      - 'research_v1_holdaware.py'
      - 'research_v1_context.py'
      - 'research_v1_pit_run.py'
      - 'research_v1_assess.py'
      - 'run_research_v1.py'
      - 'test_research_v1_core.py'
      - 'test_research_v1_portfolio.py'
      - '.github/workflows/indexalert-research-v1.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 'Smoke start (YYYY-MM-DD)'
        required: false
        default: '2025-01-01'
      end:
        description: 'Smoke end (YYYY-MM-DD)'
        required: false
        default: '2026-09-28'
      universe_size:
        description: 'Fixed non-PIT KOSPI smoke basket size'
        required: false
        default: '30'
      pit_start:
        description: 'PIT preliminary start (YYYY-MM-DD)'
        required: false
        default: '2024-01-01'
      pit_end:
        description: 'PIT preliminary end (YYYY-MM-DD)'
        required: false
        default: '2026-09-28'

jobs:
  smoke-test-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install research-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.1.1 pandas==2.3.3 numpy==2.5.3 requests==2.32.3 pyarrow==21.0.0 scikit-learn==1.7.2

      - name: Unit tests
        run: pytest -q test_research_v1_core.py test_research_v1_portfolio.py

      - name: Build public real-price smoke panel
        env:
          START_DATE: ${{ github.event.inputs.start || '2025-01-01' }}
          END_DATE: ${{ github.event.inputs.end || '2026-09-28' }}
          UNIVERSE_SIZE: ${{ github.event.inputs.universe_size || '30' }}
        run: |
          python research_v1_public.py --start "$START_DATE" --end "$END_DATE" --universe-size "$UNIVERSE_SIZE" --sleep 0.10

      - name: Run Baseline smoke tournament
        run: |
          python run_research_v1.py --cache research_data/public_smoke_daily --result-dir research_results/public_smoke --top-k 3 --horizon 5 --target 0.04 --stop -0.025 --participation 0.0005

      - name: Run ML walk-forward smoke tournament
        run: |
          python research_v1_ml.py --cache research_data/public_smoke_daily --result-dir research_results/public_smoke_ml --top-k 3 --horizon 5 --target 0.04 --stop -0.025 --participation 0.0005 --train-days 200 --test-days 40

      - name: Run Hold-aware TOP3-only comparison
        run: |
          python research_v1_holdaware.py --cache research_data/public_smoke_daily --result-dir research_results/public_smoke_holdaware --top-k 3 --horizon 5 --target 0.04 --stop -0.025 --participation 0.0005 --train-days 200 --test-days 40

      - name: Run Market-context challenger
        run: |
          python research_v1_context.py --cache research_data/public_smoke_daily --result-dir research_results/public_smoke_context --top-k 3 --horizon 5 --target 0.04 --stop -0.025 --participation 0.0005 --train-days 200 --test-days 40

      - name: Run Selective NO-TRADE smoke tournament
        run: |
          python research_v1_selective.py --cache research_data/public_smoke_daily --result-dir research_results/public_smoke_selective --top-k 3 --horizon 5 --target 0.04 --stop -0.025 --participation 0.0005

      - name: Assess short-term suitability
        run: |
          python research_v1_assess.py
          cat research_results/assessment/assessment.md

      - name: Show smoke summaries and limitations
        if: always()
        run: |
          test -f research_results/public_smoke/summary.json && cat research_results/public_smoke/summary.json || true
          test -f research_results/public_smoke_ml/summary.json && cat research_results/public_smoke_ml/summary.json || true
          test -f research_results/public_smoke_holdaware/summary.json && cat research_results/public_smoke_holdaware/summary.json || true
          test -f research_results/public_smoke_context/summary.json && cat research_results/public_smoke_context/summary.json || true
          test -f research_results/public_smoke_selective/summary.json && cat research_results/public_smoke_selective/summary.json || true
          test -f research_results/assessment/assessment.json && cat research_results/assessment/assessment.json || true

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-research-v1-public-smoke-results
          path: |
            research_results/public_smoke/
            research_results/public_smoke_ml/
            research_results/public_smoke_holdaware/
            research_results/public_smoke_context/
            research_results/public_smoke_selective/
            research_results/assessment/
            research_data/public_smoke_daily/build_stats.json
            research_data/public_smoke_daily/limitations.json
            research_data/public_smoke_daily/universe.json
            research_data/public_smoke_daily/failures.json
          if-no-files-found: warn
          retention-days: 30

  pit-preliminary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install PIT research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.5.3 requests==2.32.3 pyarrow==21.0.0 scikit-learn==1.7.2

      - name: Cache marcap yearly source files
        uses: actions/cache@v4
        with:
          path: research_data/marcap_raw
          key: marcap-pit-v1-${{ github.event.inputs.pit_start || '2024-01-01' }}-${{ github.event.inputs.pit_end || '2026-09-28' }}
          restore-keys: |
            marcap-pit-v1-

      - name: Build historical KOSPI PIT membership panel
        env:
          PIT_START: ${{ github.event.inputs.pit_start || '2024-01-01' }}
          PIT_END: ${{ github.event.inputs.pit_end || '2026-09-28' }}
        run: |
          python research_v1_marcap.py --start "$PIT_START" --end "$PIT_END" --out research_data/marcap_kospi_pit --raw research_data/marcap_raw
          cat research_data/marcap_kospi_pit/build_stats.json
          cat research_data/marcap_kospi_pit/limitations.json

      - name: Run PIT preliminary model tournament
        run: |
          python research_v1_pit_run.py --cache research_data/marcap_kospi_pit --result-dir research_results/marcap_pit --top-k 3 --horizon 5 --target 0.04 --stop -0.025 --participation 0.0005 --train-days 200 --test-days 40

      - name: Show PIT preliminary assessment
        if: always()
        run: |
          test -f research_results/marcap_pit/summary.json && cat research_results/marcap_pit/summary.json || true
          test -f research_results/marcap_pit/candidate_comparison.csv && cat research_results/marcap_pit/candidate_comparison.csv || true

      - name: Upload PIT preliminary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexalert-research-v1-marcap-pit-preliminary
          path: |
            research_results/marcap_pit/
            research_data/marcap_kospi_pit/build_stats.json
            research_data/marcap_kospi_pit/limitations.json
            research_data/marcap_kospi_pit/rejected_invalid_bars.parquet
          if-no-files-found: warn
          retention-days: 30
