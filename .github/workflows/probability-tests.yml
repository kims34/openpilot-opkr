name: Probability integrity tests
on:
  push:
    branches: [index-alert-server]
    paths: ['probability_model.py', 'next_day_probability.py', 'test_probability.py', 'requirements.txt', '.github/workflows/probability-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -p test_probability.py -v
