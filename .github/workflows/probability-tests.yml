name: Probability integrity tests
on:
  push:
    branches: [index-alert-server]
    paths:
      - 'probability_model.py'
      - 'probability_model_v31_runtime.py'
      - 'next_day_probability.py'
      - 'next_day_probability_v31.py'
      - 'one_month_probability.py'
      - 'one_month_distribution.py'
      - 'one_month_calibrated.py'
      - 'test_probability.py'
      - 'test_one_month_probability.py'
      - 'test_one_month_distribution.py'
      - 'test_one_month_calibrated.py'
      - 'requirements.txt'
      - '.github/workflows/probability-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_probability.py test_one_month_probability.py test_one_month_distribution.py test_one_month_calibrated.py -v
