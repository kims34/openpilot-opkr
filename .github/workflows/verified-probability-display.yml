name: Verified probability display policy
on:
  push:
    branches: [verified-probability-display-server, indexalert-touch-shadow-20261116]
  pull_request:
    branches: [index-alert-server]
    paths:
      - 'verified_probability_display.py'
      - 'test_verified_probability_display.py'
      - 'production_v20.py'
      - 'production_v23.py'
      - 'Dockerfile'
      - '.github/workflows/verified-probability-display.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.3 numpy==2.3.5 pandas==2.2.3 exchange-calendars==4.13.2
      - run: python -m unittest test_verified_probability_display test_probability_live_gate test_probability_pipeline test_monthly_prospective test_monthly_touch_shadow -v
