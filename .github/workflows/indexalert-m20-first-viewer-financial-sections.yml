name: IndexAlert M20 First DART Viewer Financial Sections
on:
  push:
    branches: [indexalert-m20-opendart-original-proof-20261013]
    paths:
      - 'research_v1_opendart_m20_2022_first_viewer_financial_sections.py'
      - 'test_research_v1_opendart_m20_2022_first_viewer_financial_sections.py'
      - '.github/workflows/indexalert-m20-first-viewer-financial-sections.yml'
permissions:
  contents: read
concurrency:
  group: m20-2022-first-viewer-financial-subsections
  cancel-in-progress: false
jobs:
  offline-private-original-subsection-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3 defusedxml==0.7.1
      - name: Validate initial-receipt bounded financial TOC and fail-closed tests
        run: |
          python -m py_compile research_v1_opendart_m20_2022_first_viewer_financial_sections.py test_research_v1_opendart_m20_2022_first_viewer_financial_sections.py
          python -m unittest -v test_research_v1_opendart_m20_2022_first_viewer_financial_sections
      - name: Confirm read-only and no trading permission
        run: |
          ! grep -E 'api.kiwoom.com|data.krx.co.kr|data-dbg.krx.co.kr|/api/dostk/ordr' research_v1_opendart_m20_2022_first_viewer_financial_sections.py
          grep -F '"m20_performance_run_authorized": False' research_v1_opendart_m20_2022_first_viewer_financial_sections.py
          grep -F '"ordering": "DISABLED"' research_v1_opendart_m20_2022_first_viewer_financial_sections.py
  official-original-financial-subsection-source:
    needs: offline-private-original-subsection-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3 defusedxml==0.7.1
      - name: Resolve exact original DART viewer four financial sections read-only
        run: |
          python research_v1_opendart_m20_2022_first_viewer_financial_sections.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research_results/opendart_m20_2022_original_viewer_financial_sections/counts.json").read_text())
          assert r["credential_present"] is True
          assert r["fixed_cohort_slot"] == 5
          assert r["max_official_requests"] == 2
          assert r["max_public_viewer_requests"] == 5
          assert r["source_status"] == "FIRST_SUBMITTED_VIEWER_FINANCIAL_SUBDOC_LEXICAL_DIAGNOSTIC_ONLY", r.get("failure_code","SOURCE_UNKNOWN")
          assert r["first_receipt_financial_toc_sections_selected"] == 4
          assert r["viewer_financial_sections_returned_html"] == 4
          assert r["viewer_section_lexical_metadata_is_not_original_pit_proof"] is True
          assert r["ordering"] == "DISABLED"
          for key in ("original_2022_cfs_profit_three_month_verified",
                      "original_2021_comparator_three_month_verified",
                      "original_viewer_html_is_immutable_filing_proof",
                      "viewer_financial_toc_is_accounting_statement_lineage",
                      "original_2022_xbrl_verified",
                      "original_publication_instant_verified",
                      "historical_issuer_security_pit_verified",
                      "m20_feature_pit_admitted", "m20_performance_run_authorized",
                      "independent_holdout_authorized", "champion_change_authorized",
                      "real_orders_authorized", "funds_movement_authorized",
                      "permissions_change_authorized",
                      "raw_amounts_document_ids_titles_url_params_source_or_secrets_saved"):
            assert r[key] is False,key
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m20-2022-original-viewer-financial-section-counts-only
          path: research_results/opendart_m20_2022_original_viewer_financial_sections/counts.json
          retention-days: 7
          if-no-files-found: warn
