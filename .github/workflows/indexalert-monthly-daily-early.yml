name: IndexAlert earliest daily 21-session replay 2002-2009
on:
  push:
    branches: [indexalert-monthly-daily-early-history-20261116]
    paths:
      - research_monthly_daily_all_years.py
      - .github/workflows/indexalert-monthly-daily-early.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily-replay-early:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        symbol: [SPY, QQQ]
        year: [2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.3 exchange-calendars==4.13.2 requests==2.32.3
      - name: Daily history replay, explicitly mark partial 10y vintages
        run: |
          python -m py_compile research_monthly_daily_all_years.py
          python research_monthly_daily_all_years.py --symbol ${{ matrix.symbol }} --year ${{ matrix.year }}
      - name: Archive full daily forecast-and-label CSV and score JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-early-${{ matrix.symbol }}-${{ matrix.year }}
          path: daily_monthly_artifacts/*
          retention-days: 90
