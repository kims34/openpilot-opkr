name: IndexAlert APK
on:
  push:
    branches: [ index-alert-build ]
    paths:
      - 'index-alert/**'
      - '.github/workflows/index-alert-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: index-alert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IndexAlert-apk
          path: index-alert/app/build/outputs/apk/debug/app-debug.apk
