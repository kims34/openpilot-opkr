name: IndexAlert APK
on:
  push:
    branches: [ index-alert-build ]
    paths:
      - 'index-alert/**'
      - '.github/workflows/index-alert-build.yml'
  workflow_dispatch:
concurrency:
  group: index-alert-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: index-alert
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug and unsigned release APKs
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: Collect Android APK signing tools
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p ../apksigner-tool/lib
          cp "$BT/apksigner" ../apksigner-tool/
          cp "$BT/zipalign" ../apksigner-tool/
          cp "$BT/lib/apksigner.jar" ../apksigner-tool/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: IndexAlert-v1.6-debug
          path: index-alert/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IndexAlert-v1.6-unsigned-release
          path: index-alert/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-tool
          path: apksigner-tool
