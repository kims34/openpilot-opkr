name: IndexAlert APK
on:
  push:
    branches: [ index-alert-build ]
    paths:
      - 'index-alert/**'
      - '.github/workflows/index-alert-build.yml'
  workflow_dispatch:
concurrency:
  group: index-alert-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: index-alert
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IndexAlert-apk
          path: index-alert/app/build/outputs/apk/debug/app-debug.apk
