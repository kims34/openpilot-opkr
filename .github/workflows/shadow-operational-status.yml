name: Shadow Operational Status
on:
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - shadow_operational_status.py
      - test_shadow_operational_status.py
      - shadow_operational_dashboard.py
      - test_shadow_operational_dashboard.py
      - order_intent_journal.py
      - shadow_capital_allocator.py
      - indexalert_automation_control.py
      - .github/workflows/shadow-operational-status.yml
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_shadow_operational_status test_shadow_operational_dashboard
