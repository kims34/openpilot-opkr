name: IndexAlert KRX OpenAPI Prospective Source

on:
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_krx_openapi_prospective_source.py'
      - 'test_research_v1_krx_openapi_prospective_source.py'
      - 'research_v1_prospective_inputs.py'
      - 'INDEXALERT_KRX_OPENAPI_PROSPECTIVE_SOURCE_2026-10-07.md'
      - '.github/workflows/indexalert-krx-openapi-prospective-source.yml'
  push:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_krx_openapi_prospective_source.py'
      - 'test_research_v1_krx_openapi_prospective_source.py'
      - 'research_v1_prospective_inputs.py'
      - 'INDEXALERT_KRX_OPENAPI_PROSPECTIVE_SOURCE_2026-10-07.md'
      - '.github/workflows/indexalert-krx-openapi-prospective-source.yml'

permissions:
  contents: read

jobs:
  synthetic-source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 requests==2.32.3
      - name: Verify official OpenAPI source normalization without network
        run: python -m unittest test_research_v1_krx_openapi_prospective_source.py test_research_v1_prospective_inputs.py
