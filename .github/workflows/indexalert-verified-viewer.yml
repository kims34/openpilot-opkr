name: IndexAlert separate verified viewer
on:
  push:
    branches: [indexalert-installable-viewer-20261116]
  pull_request:
    branches: [index-alert-build]
    paths:
      - 'index-alert/viewer/**'
      - 'index-alert/settings.gradle.kts'
      - '.github/workflows/indexalert-verified-viewer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: index-alert
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :viewer:testDebugUnitTest :viewer:assembleDebug --stacktrace
      - name: Audit separate package, dependencies, permissions and tests
        run: |
          gradle :viewer:dependencies --configuration debugRuntimeClasspath > viewer-dependencies.txt
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,xml.etree.ElementTree as ET
          root=pathlib.Path('.')
          dependency=pathlib.Path('viewer-dependencies.txt').read_text()
          assert 'com.google.firebase' not in dependency and 'androidx.work' not in dependency
          suites=[ET.parse(p).getroot() for p in pathlib.Path('viewer/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          assert len(suites)==1 and sum(int(s.get('tests','0')) for s in suites)==4
          assert all(int(s.get(k,'0'))==0 for s in suites for k in ('failures','errors','skipped'))
          directory=pathlib.Path('viewer/build/outputs/apk/debug')
          meta=json.loads((directory/'output-metadata.json').read_text())
          assert meta['applicationId']=='com.indexalert.verified'
          apk=directory/meta['elements'][0]['outputFile']
          tool=sorted(p for p in (pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').iterdir() if (p/'aapt2').is_file() and (p/'apksigner').is_file())[-1]
          badging=subprocess.check_output([str(tool/'aapt2'),'dump','badging',str(apk)],text=True)
          assert "name='com.indexalert.verified'" in badging and "application-label:'IndexAlert 검증 화면'" in badging
          for forbidden in ('POST_NOTIFICATIONS','RECEIVE_BOOT_COMPLETED','WAKE_LOCK'):
              assert forbidden not in badging
          signature=subprocess.check_output([str(tool/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)
          result={'application_id':meta['applicationId'],'source_head':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'tests':4,'firebase':False,'workmanager':False,'original_app_replaced':False,'orders_enabled':False}
          pathlib.Path('viewer-verification.json').write_text(json.dumps(result,indent=2)+'\n')
          pathlib.Path('viewer-badging.txt').write_text(badging)
          import shutil
          shutil.copy(tool/'lib'/'apksigner.jar','viewer-apksigner.jar')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: IndexAlert-separate-verified-viewer
          path: |
            index-alert/viewer/build/outputs/apk/debug/*.apk
            index-alert/viewer/build/test-results/testDebugUnitTest/TEST-*.xml
            index-alert/viewer-verification.json
            index-alert/viewer-badging.txt
            index-alert/viewer-apksigner.jar
