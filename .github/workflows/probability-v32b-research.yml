name: Probability v3.2b regularization research
on:
  push:
    branches: [index-alert-probability-v32]
    paths:
      - 'probability_research_v32.py'
      - 'probability_research_v32b.py'
      - 'requirements.txt'
      - '.github/workflows/probability-v32b-research.yml'
  workflow_dispatch:
concurrency:
  group: probability-v32b-research
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Selection regularization research
        run: python probability_research_v32b.py | tee probability-v32b-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probability-v32b-results
          path: probability-v32b-result.txt
