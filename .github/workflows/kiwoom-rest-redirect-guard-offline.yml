name: IndexAlert Kiwoom REST Redirect Guard (offline only)

on:
  push:
    branches: [indexalert-kiwoom-rest-redirect-guard-20261014]
    paths:
      - 'kiwoom_real_type00_readonly_smoke.py'
      - 'kiwoom_real_readonly/smoke.py'
      - 'test_kiwoom_real_type00_readonly_smoke.py'
      - 'kiwoom_readonly_route_compare.py'
      - 'test_kiwoom_readonly_route_compare.py'
      - 'RUN_KIWOOM_READONLY_DIAG.cmd'
      - 'kiwoom_readonly_pc_requirements.txt'
      - 'KIWOOM_8050_REGISTERED_PC_ROUTE_COMPARE_RUNBOOK.md'
      - 'kiwoom_token_mode_probe.py'
      - 'test_kiwoom_token_mode_probe.py'
      - 'test_kiwoom_rest_redirect_guard.py'
      - 'kiwoom_real_quote_readonly_contract.py'
      - 'test_kiwoom_real_quote_readonly_contract.py'
      - '.github/workflows/kiwoom-rest-redirect-guard-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install requests==2.32.3 websockets==15.0.1
      - name: Syntax validation and mirrored-source parity
        run: |
          python -m py_compile kiwoom_real_type00_readonly_smoke.py kiwoom_real_readonly/smoke.py test_kiwoom_rest_redirect_guard.py kiwoom_real_quote_readonly_contract.py test_kiwoom_real_quote_readonly_contract.py
          cmp -s kiwoom_real_type00_readonly_smoke.py kiwoom_real_readonly/smoke.py
      - name: Execute broker-network-free safety regressions
        run: |
          python -m unittest -v test_kiwoom_real_type00_readonly_smoke test_kiwoom_token_mode_probe test_kiwoom_readonly_route_compare test_kiwoom_rest_redirect_guard test_kiwoom_real_quote_readonly_contract
      - name: Existing order journal and settlement fail-closed regression
        run: |
          python -m unittest -v test_account_settlement_binding test_journal_settlement_binding test_account_cashflow_reconciliation test_kiwoom_settlement_history test_native_cashflow_binding test_native_settlement_readiness test_native_cashflow_review_manifest test_native_settlement_review_cli test_early_live_admission_gate test_kiwoom_account_settlement_evidence
      - name: Enforce credential redirection and ordering fail-closed invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("kiwoom_real_type00_readonly_smoke.py").read_text()
          assert src.count("            allow_redirects=False,") == 2
          assert src.count("_require_http_200(") == 3
          quote_contract = Path("kiwoom_real_quote_readonly_contract.py").read_text()
          assert '"/api/dostk/stkinfo"' in quote_contract
          assert '"ka10001"' in quote_contract
          for forbidden in ('/api/dostk/ordr', 'kt10000', 'kt10001', 'kt10002', 'kt10003'):
              assert forbidden not in quote_contract
          token_probe = Path("kiwoom_token_mode_probe.py").read_text()
          assert token_probe.count("allow_redirects=False") == 1
          # Distinct account-matched Type00 admission is required as well as REG ACK.
          assert 'TYPE00_EVENTS_UNMATCHED_ACCOUNT' in src
          comparator = Path('kiwoom_readonly_route_compare.py').read_text()
          assert 'TYPE00_EVENTS_UNMATCHED_ACCOUNT' in comparator
          assert 'matched <= 0' in comparator
          assert 'REAL_ORDERS_AUTHORIZED: bool = False' in src
          assert 'ORDERING: str = "DISABLED"' in src
          for forbidden in ('/api/dostk/ordr', 'kt10000', 'kt10001', 'kt10002', 'kt10003'):
              assert forbidden not in src
          PY

      - name: Pack validated Windows diagnostic (read-only; no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: kiwoom-readonly-pc-diagnostic-redirect-guard
          path: |
            kiwoom_real_type00_readonly_smoke.py
            kiwoom_readonly_route_compare.py
            RUN_KIWOOM_READONLY_DIAG.cmd
            kiwoom_readonly_pc_requirements.txt
            KIWOOM_8050_REGISTERED_PC_ROUTE_COMPARE_RUNBOOK.md
          if-no-files-found: error
          retention-days: 7
      - name: Re-download exactly the archived diagnostic files
        uses: actions/download-artifact@v4
        with:
          name: kiwoom-readonly-pc-diagnostic-redirect-guard
          path: verify-redirect-guard-artifact
      - name: Check one-extraction layout and byte-for-byte source agreement
        run: |
          python - <<'PY'
          from pathlib import Path
          folder = Path("verify-redirect-guard-artifact")
          expected = {
              "kiwoom_real_type00_readonly_smoke.py",
              "kiwoom_readonly_route_compare.py",
              "RUN_KIWOOM_READONLY_DIAG.cmd",
              "kiwoom_readonly_pc_requirements.txt",
              "KIWOOM_8050_REGISTERED_PC_ROUTE_COMPARE_RUNBOOK.md",
          }
          actual = {str(p.relative_to(folder)).replace("\\", "/") for p in folder.rglob("*") if p.is_file()}
          assert actual == expected, (actual, expected)
          for filename in expected:
              assert (folder / filename).read_bytes() == Path(filename).read_bytes(), filename
          PY

  offline-order-resilience:
    # Separate non-network test lane. No broker credentials, ordering or deployment.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile safety components (no broker invocation)
        run: |
          python -m py_compile order_intent_journal.py kiwoom_execution_inbox.py kiwoom_order_journal_bridge.py order_snapshot_reconciliation.py kiwoom_protected_execution_intake.py shadow_capital_allocator.py
      - name: Execute duplicate-order, kill, partial-fill, restart and settlement recovery regressions
        run: |
          python -m unittest -v \
            test_order_intent_journal \
            test_shadow_safety_control \
            test_order_snapshot_reconciliation \
            test_kiwoom_order_journal_bridge \
            test_kiwoom_execution_inbox \
            test_kiwoom_protected_execution_intake \
            test_shadow_late_fill_capital \
            test_shadow_principal_release \
            test_kiwoom_order_request_contract \
            test_kiwoom_realtime_order_fill_subscription_contract
      - name: Assert source-only ordering boundary in CI
        run: |
          python - <<'PY'
          from pathlib import Path
          test_files = (
              'test_order_intent_journal.py',
              'test_shadow_safety_control.py',
              'test_order_snapshot_reconciliation.py',
              'test_kiwoom_order_journal_bridge.py',
              'test_kiwoom_execution_inbox.py',
              'test_kiwoom_protected_execution_intake.py',
              'test_shadow_late_fill_capital.py',
              'test_shadow_principal_release.py',
              'test_kiwoom_order_request_contract.py',
              'test_kiwoom_realtime_order_fill_subscription_contract.py',
          )
          assert all(Path(name).is_file() for name in test_files)
          # No real broker credentials or externally supplied order permissions
          # are introduced by this read-only workflow.
          wf = Path('.github/workflows/kiwoom-rest-redirect-guard-offline.yml').read_text()
          uses = [line.strip().split('uses:', 1)[1].strip()
                  for line in wf.splitlines() if line.strip().startswith('- uses:')]
          allowed = ('actions/checkout@', 'actions/setup-python@',
                     'actions/upload-artifact@', 'actions/download-artifact@')
          assert uses and all(action.startswith(allowed) for action in uses)
          assert 'contents: read' in wf
          assert 'persist-credentials: false' in wf
          PY
