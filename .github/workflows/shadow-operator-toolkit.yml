name: Shadow Operator Toolkit
on:
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - '*settlement*.py'
      - '*cashflow*.py'
      - shadow_operational_*.py
      - test_shadow_dashboard_script.py
      - test_shadow_dashboard_browser.py
      - order_intent_journal.py
      - order_snapshot_reconciliation.py
      - indexalert_automation_control.py
      - shadow_capital_allocator.py
      - early_live_admission_gate.py
      - build_shadow_operator_toolkit.py
      - test_shadow_operator_toolkit.py
      - INDEXALERT_OPERATOR_TOOLKIT_README.md
      - operator-toolkit-requirements.txt
      - .github/workflows/shadow-operator-toolkit.yml
permissions:
  contents: read
jobs:
  toolkit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Preserve repository bytes across operating systems
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install portable timezone data
        run: python -m pip install -r operator-toolkit-requirements.txt
      - run: python -m unittest -v test_shadow_operator_toolkit test_shadow_dashboard_script test_shadow_operational_status test_shadow_operational_dashboard test_native_settlement_review_cli
      - name: Build exact feature-head archive
        shell: bash
        env:
          TOOLKIT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python build_shadow_operator_toolkit.py --source-commit "$TOOLKIT_SOURCE_SHA" --output dist/indexalert-shadow-operator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: indexalert-shadow-operator-${{ github.event.pull_request.head.sha }}-${{ matrix.os }}
          path: dist/indexalert-shadow-operator.zip
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Render read-only dashboard and verify failed-refresh recovery
        run: python -m unittest -v test_shadow_dashboard_browser
