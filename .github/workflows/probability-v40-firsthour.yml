name: Probability v4.0 first-hour research
on:
  push:
    branches: [index-alert-probability-v34-research]
    paths:
      - 'probability_v40_firsthour_research.py'
      - 'probability_v39_open_nowcast.py'
      - 'probability_model_v31_runtime.py'
      - 'probability_model_v33_runtime.py'
      - 'next_day_probability.py'
      - 'requirements.txt'
      - '.github/workflows/probability-v40-firsthour.yml'
  workflow_dispatch:
concurrency:
  group: probability-v40-firsthour
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run first-hour holdout research
        run: python probability_v40_firsthour_research.py | tee probability-v40-firsthour-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: probability-v40-firsthour-result
          path: probability-v40-firsthour-result.json
