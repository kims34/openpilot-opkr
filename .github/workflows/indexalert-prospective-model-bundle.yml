name: IndexAlert Prospective Model Bundle

on:
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_prospective_model_bundle.py'
      - 'test_research_v1_prospective_model_bundle.py'
      - 'INDEXALERT_PROSPECTIVE_MODEL_BUNDLE_2026-10-07.md'
      - '.github/workflows/indexalert-prospective-model-bundle.yml'
  push:
    branches: [index-alert-position-regen-fix-v1]
    paths:
      - 'research_v1_prospective_model_bundle.py'
      - 'test_research_v1_prospective_model_bundle.py'
      - 'INDEXALERT_PROSPECTIVE_MODEL_BUNDLE_2026-10-07.md'
      - '.github/workflows/indexalert-prospective-model-bundle.yml'

permissions:
  contents: read

jobs:
  synthetic-model-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0
      - name: Verify deterministic non-authorizing model bundle
        run: python -m unittest test_research_v1_prospective_model_bundle.py
