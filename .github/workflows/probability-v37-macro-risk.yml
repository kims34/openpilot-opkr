name: Probability v3.7 macro-risk holdout research
on:
  push:
    branches: [index-alert-server]
    paths:
      - 'probability_v37_macro_risk.py'
      - '.github/workflows/probability-v37-macro-risk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Macro risk untouched holdout
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import requests
          import next_day_probability as base
          import probability_v37_macro_risk as research

          raw = {}
          metas = {}
          for symbol in ('SPY','QQQ','SCHD'):
              rows, meta = base.fetch_history(symbol, time.time())
              raw[symbol] = dict(rows)
              metas[symbol] = meta

          extra = ('^VIX','TLT','HYG','IWM','UUP','GLD')
          ny = ZoneInfo('America/New_York')
          for symbol in extra:
              url_symbol = requests.utils.quote(symbol, safe='')
              response = requests.get(
                  f'https://query1.finance.yahoo.com/v8/finance/chart/{url_symbol}',
                  params={'range':'10y','interval':'1d','includePrePost':'false','events':'div,splits'},
                  headers={'User-Agent':'Mozilla/5.0 IndexAlert/3.7'}, timeout=20,
              )
              response.raise_for_status()
              result = (response.json().get('chart',{}).get('result') or [None])[0]
              if not result:
                  raise RuntimeError(f'no data: {symbol}')
              timestamps = result.get('timestamp') or []
              closes = (result.get('indicators',{}).get('quote') or [{}])[0].get('close') or []
              rows = {}
              for ts, close in zip(timestamps, closes):
                  if close is None or float(close) <= 0:
                      continue
                  day = datetime.fromtimestamp(int(ts), timezone.utc).astimezone(ny).date().isoformat()
                  rows[day] = float(close)
              raw[symbol] = rows

          common = sorted(set.intersection(*(set(series) for series in raw.values())))
          if len(common) < 1800:
              raise RuntimeError(f'aligned history too short: {len(common)}')
          aligned = {symbol: (common, [raw[symbol][d] for d in common]) for symbol in raw}
          target_date = metas['SPY']['target_date']
          print('V37_ALIGNMENT', len(common), common[0], common[-1], target_date)
          for symbol in ('SPY','QQQ','SCHD'):
              result = research.evaluate(aligned, symbol, target_date)
              print('V37_RESEARCH', symbol, json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
