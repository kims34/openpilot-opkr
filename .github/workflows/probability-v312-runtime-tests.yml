name: Probability v3.12 runtime parity tests
on:
  push:
    branches: [index-alert-server]
    paths:
      - 'preopen_futures_v312.py'
      - 'probability_v312_futures_preopen.py'
      - 'production_v22.py'
      - 'Dockerfile'
      - '.github/workflows/probability-v312-runtime-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Historical live-path parity and time gate
        run: |
          python - <<'PY'
          import time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import numpy as np
          import requests
          import next_day_probability as base
          import probability_model_v33_runtime as v33
          import probability_v312_futures_preopen as research
          import preopen_futures_v312 as live

          NY=ZoneInfo('America/New_York')
          UA={'User-Agent':'Mozilla/5.0 IndexAlert/3.12-runtime-test'}

          def yahoo(symbol,range_,interval):
              u=requests.utils.quote(symbol,safe='')
              x=requests.get(f'https://query1.finance.yahoo.com/v8/finance/chart/{u}',params={
                  'range':range_,'interval':interval,'includePrePost':'true','events':'div,splits'
              },headers=UA,timeout=30)
              x.raise_for_status(); result=(x.json()['chart'].get('result') or [None])[0]
              if not result: raise RuntimeError(symbol)
              ts=result.get('timestamp') or []
              c=(result.get('indicators',{}).get('quote') or [{}])[0].get('close') or []
              return [(int(t),float(v)) for t,v in zip(ts,c) if v is not None and float(v)>0]

          daily={}
          for s in ('^VIX','^TNX'):
              vals={}
              for ts,c in yahoo(s,'5y','1d'):
                  vals[datetime.fromtimestamp(ts,timezone.utc).astimezone(NY).date().isoformat()]=c
              daily[s]=vals
          hourly={s:[(datetime.fromtimestamp(ts,timezone.utc).astimezone(NY),c) for ts,c in yahoo(s,'2y','1h')]
                  for s in research.FUTURES}

          for symbol in ('SPY','QQQ'):
              rows,meta=base.fetch_history(symbol,time.time())
              dates=[d for d,_ in rows]; prices=[p for _,p in rows]
              # Full-history research prediction for the last scored target.
              trace=research._served_trace(prices,dates,meta['target_date'])
              prev=np.asarray([float(z['probability']) for z in trace])
              out=np.asarray([float(z['outcome']) for z in trace])
              x,_=research._feature_rows(prices,dates,trace,hourly,daily)
              pred,adjusted=research._predict(x,out,prev,live.CONFIGS[symbol])
              valid=np.where(np.all(np.isfinite(x),axis=1)&adjusted)[0]
              j=int(valid[-1])
              expected=float(pred[j])*100.0

              # Recreate that same forecast as if running live one session earlier.
              cut=rows[:-1]
              cut_dates=[d for d,_ in cut]; cut_prices=[p for _,p in cut]
              target=dates[-1]
              base_result=v33.estimate_prices(cut_prices,dates=cut_dates,target_date=target)
              cut_meta={'as_of':cut_dates[-1],'target_date':target}
              runtime=live._fit_live(symbol,float(base_result['probability']),cut,cut_meta,hourly,daily)
              got=float(runtime['probability'])
              if abs(got-expected)>1e-8:
                  raise RuntimeError(f'{symbol} parity mismatch expected={expected} got={got}')
              print('V312_RUNTIME_PARITY',symbol,target,expected,got)

          # Availability gate must not fetch/compute before 09:05 ET.
          item={'as_of':'2026-09-25','target_date':'2026-09-28','probability':55.0}
          before=datetime(2026,9,28,9,4,tzinfo=NY).timestamp()
          gated=live.estimate('SPY',item,before)
          assert gated['available'] is False and '09:05' in gated['status']
          rejected=live.estimate('SCHD',item,before)
          assert rejected['available'] is False and '검증 통과 종목 아님' in rejected['status']
          print('V312_RUNTIME_GATES passed')
          PY
