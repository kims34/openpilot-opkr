name: IndexAlert prospective monthly ledger and original API safety
on:
  push:
    branches: [indexalert-monthly-prospective-20261116]
    paths:
      - monthly_prospective.py
      - test_monthly_prospective.py
      - next_day_probability_v33.py
      - production_v31.py
      - Dockerfile
      - .github/workflows/indexalert-monthly-prospective.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-only-ledger-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.3 exchange-calendars==4.13.2 requests==2.32.3
      - name: Compile original app integration without deploying
        run: |
          python -m py_compile monthly_prospective.py next_day_probability_v33.py production_v31.py
          python -m unittest -v test_monthly_prospective
