name: Offline Kiwoom Journal Binding
on:
  push:
    branches: [index-alert-kiwoom-journal-binding-v1, index-alert-late-fill-capital-restore-v1, index-alert-native-execution-inbox-v1, index-alert-position-regen-fix-v1, index-alert-early-live-v2-prereg]
    paths: [kiwoom_execution_inbox.py, test_kiwoom_execution_inbox.py, shadow_capital_allocator.py, test_shadow_late_fill_capital.py, shadow_fault_replay.py, test_order_intent_journal.py, order_intent_journal.py, kiwoom_order_journal_bridge.py, test_kiwoom_order_journal_bridge.py, research_v1_kiwoom_native_execution.py, kiwoom_account_settlement_evidence.py, test_kiwoom_account_settlement_evidence.py, .github/workflows/kiwoom-journal-binding.yml]
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths: [kiwoom_execution_inbox.py, test_kiwoom_execution_inbox.py, shadow_capital_allocator.py, test_shadow_late_fill_capital.py, shadow_fault_replay.py, test_order_intent_journal.py, order_intent_journal.py, kiwoom_order_journal_bridge.py, test_kiwoom_order_journal_bridge.py, research_v1_kiwoom_native_execution.py, .github/workflows/kiwoom-journal-binding.yml]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            order_intent_journal.py
            order_snapshot_reconciliation.py
            shadow_capital_allocator.py
            indexalert_automation_control.py
            shadow_fault_replay.py
            test_order_intent_journal.py
            test_order_snapshot_reconciliation.py
            test_shadow_capital_allocator.py
            test_shadow_principal_release.py
            test_shadow_late_fill_capital.py
            test_shadow_safety_control.py
            test_indexalert_automation_control.py
            test_automation_risk_boundaries.py
            test_shadow_fault_replay.py
            research_v1_kiwoom_native_execution.py
            test_research_v1_kiwoom_native_execution.py
            kiwoom_execution_inbox.py
            test_kiwoom_execution_inbox.py
            kiwoom_order_journal_bridge.py
            test_kiwoom_order_journal_bridge.py
            kiwoom_account_settlement_evidence.py
            test_kiwoom_account_settlement_evidence.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q
