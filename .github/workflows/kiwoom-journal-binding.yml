name: Offline Kiwoom Journal Binding
on:
  push:
    branches: [index-alert-kiwoom-journal-binding-v1, index-alert-late-fill-capital-restore-v1, index-alert-native-execution-inbox-v1, index-alert-protected-account-intake-v1, index-alert-official-intake-fields-v1, index-alert-position-regen-fix-v1, index-alert-demo-readonly-transport-v1, index-alert-demo-readonly-verifier-v1, index-alert-holdings-diagnostics-v1, index-alert-demo-cursor-collection-v1]
    paths: [order_snapshot_reconciliation.py, test_order_snapshot_reconciliation.py, test_shadow_stop_claim_concurrency.py, kiwoom_demo_holdings_verifier.py, test_kiwoom_demo_holdings_verifier.py, kiwoom_demo_snapshot_collection.py, test_kiwoom_demo_snapshot_collection.py, kiwoom_holdings_diagnostics.py, test_kiwoom_holdings_diagnostics.py, kiwoom_demo_readonly_verifier.py, test_kiwoom_demo_readonly_verifier.py, kiwoom_demo_readonly_transport.py, test_kiwoom_demo_readonly_transport.py, kiwoom_readonly_configuration_audit.py, test_kiwoom_readonly_configuration_audit.py, kiwoom_protected_execution_intake.py, test_kiwoom_protected_execution_intake.py, kiwoom_execution_inbox.py, test_kiwoom_execution_inbox.py, shadow_capital_allocator.py, test_shadow_late_fill_capital.py, shadow_fault_replay.py, 'kiwoom_realtime_order_fill_subscription_contract.py', 'kiwoom_type00_frame_extractor.py', kiwoom_type00_frame_extractor.py, test_order_intent_journal.py, order_intent_journal.py, kiwoom_order_journal_bridge.py, test_kiwoom_order_journal_bridge.py, research_v1_kiwoom_native_execution.py, .github/workflows/kiwoom-journal-binding.yml]
  pull_request:
    branches: [index-alert-position-regen-fix-v1]
    paths: [order_snapshot_reconciliation.py, test_order_snapshot_reconciliation.py, test_shadow_stop_claim_concurrency.py, kiwoom_demo_holdings_verifier.py, test_kiwoom_demo_holdings_verifier.py, kiwoom_demo_snapshot_collection.py, test_kiwoom_demo_snapshot_collection.py, kiwoom_holdings_diagnostics.py, test_kiwoom_holdings_diagnostics.py, kiwoom_demo_readonly_verifier.py, test_kiwoom_demo_readonly_verifier.py, kiwoom_demo_readonly_transport.py, test_kiwoom_demo_readonly_transport.py, kiwoom_readonly_configuration_audit.py, test_kiwoom_readonly_configuration_audit.py, kiwoom_protected_execution_intake.py, test_kiwoom_protected_execution_intake.py, kiwoom_execution_inbox.py, test_kiwoom_execution_inbox.py, shadow_capital_allocator.py, test_shadow_late_fill_capital.py, shadow_fault_replay.py, 'kiwoom_realtime_order_fill_subscription_contract.py', 'kiwoom_type00_frame_extractor.py', kiwoom_realtime_order_fill_subscription_contract.py, test_order_intent_journal.py, order_intent_journal.py, kiwoom_order_journal_bridge.py, test_kiwoom_order_journal_bridge.py, research_v1_kiwoom_native_execution.py, .github/workflows/kiwoom-journal-binding.yml]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            kiwoom_demo_holdings_verifier.py
            test_kiwoom_demo_holdings_verifier.py
            kiwoom_demo_snapshot_collection.py
            test_kiwoom_demo_snapshot_collection.py
            kiwoom_holdings_diagnostics.py
            test_kiwoom_holdings_diagnostics.py
            kiwoom_demo_readonly_verifier.py
            test_kiwoom_demo_readonly_verifier.py
            kiwoom_demo_readonly_transport.py
            test_kiwoom_demo_readonly_transport.py
            kiwoom_readonly_configuration_audit.py
            test_kiwoom_readonly_configuration_audit.py
            order_intent_journal.py
            order_snapshot_reconciliation.py
            shadow_capital_allocator.py
            indexalert_automation_control.py
            shadow_fault_replay.py
            kiwoom_realtime_order_fill_subscription_contract.py
            kiwoom_type00_frame_extractor.py
            test_order_intent_journal.py
            test_order_snapshot_reconciliation.py
            test_shadow_capital_allocator.py
            test_shadow_principal_release.py
            test_shadow_late_fill_capital.py
            test_shadow_safety_control.py
            test_shadow_stop_claim_concurrency.py
            test_indexalert_automation_control.py
            test_automation_risk_boundaries.py
            test_shadow_fault_replay.py
            research_v1_kiwoom_native_execution.py
            test_research_v1_kiwoom_native_execution.py
            kiwoom_protected_execution_intake.py
            test_kiwoom_protected_execution_intake.py
            kiwoom_execution_inbox.py
            test_kiwoom_execution_inbox.py
            kiwoom_order_journal_bridge.py
            test_kiwoom_order_journal_bridge.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q
