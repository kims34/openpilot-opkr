name: IndexAlert Server Smoke
on:
  push:
    branches: [ index-alert-server ]
    paths:
      - 'monitor.py'
      - 'production.py'
      - 'production_fixed.py'
      - 'production_v17.py'
      - 'production_v30.py'
      - 'production_v31.py'
      - 'execution_evidence_ledger.py'
      - 'push_receipts.py'
      - 'push_self_test.py'
      - 'push_health.py'
      - 'test_push_receipts.py'
      - 'test_push_self_test.py'
      - 'test_push_health.py'
      - 'market_basis.py'
      - 'corporate_action_registry.py'
      - 'test_corporate_action_registry.py'
      - 'fx_basis.py'
      - 'laggards.py'
      - 'test_market_basis.py'
      - 'test_fx_basis.py'
      - 'test_laggards_direction.py'
      - 'next_day_probability.py'
      - 'next_day_probability_v31.py'
      - 'one_month_probability.py'
      - 'one_month_distribution.py'
      - 'probability_shadow.py'
      - 'probability_milestone.py'
      - 'Dockerfile'
      - 'probability_pipeline.py'
      - 'production_v23.py'
      - '.github/workflows/index-alert-server-smoke.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Syntax and regression checks
        run: |
          python -m py_compile monitor.py production.py production_fixed.py production_v17.py production_v30.py production_v31.py execution_evidence_ledger.py push_receipts.py push_self_test.py push_health.py market_basis.py corporate_action_registry.py fx_basis.py laggards.py next_day_probability.py next_day_probability_v31.py one_month_probability.py one_month_distribution.py probability_shadow.py probability_milestone.py
          python -m unittest -v test_push_receipts.py test_push_self_test.py test_push_health.py test_market_basis.py test_corporate_action_registry.py test_fx_basis.py test_laggards_direction.py
      - name: Wait for production deployment and verify API
        run: |
          set -u -o pipefail
          BASE='https://indexalert-runtime-production.up.railway.app'
          for i in $(seq 1 30); do
            validation_rc=1
            if curl -fsS --max-time 15 "$BASE/health" >/tmp/health.json && \
               curl -fsS --max-time 15 "$BASE/push-health" >/tmp/push-health.json && \
               curl -fsS --max-time 15 "$BASE/openapi.json" >/tmp/openapi.json && \
               curl -fsS --max-time 30 "$BASE/status" >/tmp/status.json && \
               curl -fsS --max-time 30 "$BASE/laggards" >/tmp/laggards.json && \
               curl -fsS --max-time 30 "$BASE/next-day-probabilities" >/tmp/prob.json; then
              set +e
              python - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          EXPECTED_FX_CONTRACT='ecos-1530-fail-closed-v1'
          EXPECTED_RUNTIME_REVISION=str(os.environ.get('GITHUB_SHA') or '').strip()
          health=json.load(open('/tmp/health.json'))
          push_health=json.load(open('/tmp/push-health.json'))
          openapi=json.load(open('/tmp/openapi.json'))
          status=json.load(open('/tmp/status.json'))
          movers=json.load(open('/tmp/laggards.json'))
          data=json.load(open('/tmp/prob.json'))
          assert health.get('ok') is True, health
          assert health.get('firebase') is True, health
          assert push_health.get('ok') is True, push_health
          assert push_health.get('firebase') is True, push_health
          assert push_health.get('tokens_exposed') is False, push_health
          assert push_health.get('client_receipts_supported') is True, push_health
          assert isinstance(push_health.get('registered_devices'), int), push_health
          assert isinstance(push_health.get('pending_deliveries'), int), push_health
          assert isinstance(push_health.get('sent_deliveries'), int), push_health
          assert isinstance(push_health.get('received_deliveries'), int), push_health
          assert isinstance(push_health.get('unconfirmed_sent_deliveries'), int), push_health

          # Never let a green response from a stale production deployment count
          # as validation for a newer GitHub revision. Railway's deploy trigger
          # is deliberately exposed as a non-secret runtime revision marker.
          if not EXPECTED_RUNTIME_REVISION or status.get('runtime_revision') != EXPECTED_RUNTIME_REVISION:
              print('production runtime revision not deployed yet', json.dumps({
                  'expected': EXPECTED_RUNTIME_REVISION,
                  'actual': status.get('runtime_revision'),
              }, ensure_ascii=False))
              raise SystemExit(1)

          # Physical-E2E readiness must be bound to the latest Android build self-test,
          # not inferred from an old aggregate receipt. These fields also serve as a
          # production-deployment contract: stale server deployments fail this smoke.
          assert 'latest_self_test_build' in push_health, push_health
          assert isinstance(push_health.get('latest_self_test_sent'), bool), push_health
          assert isinstance(push_health.get('latest_self_test_receipt_confirmed'), bool), push_health
          assert isinstance(push_health.get('current_build_physical_e2e_confirmed'), bool), push_health
          if push_health.get('latest_self_test_build') is not None:
              assert isinstance(push_health['latest_self_test_build'], str) and push_health['latest_self_test_build'], push_health
          if push_health['current_build_physical_e2e_confirmed']:
              assert push_health.get('latest_self_test_build'), push_health
              assert push_health['latest_self_test_sent'] is True, push_health
              assert push_health['latest_self_test_receipt_confirmed'] is True, push_health

          paths=openapi.get('paths') or {}
          assert '/push-ack' in paths, paths
          assert '/push-self-test' in paths, paths

          by_id={row.get('id'): row for row in status.get('indices', [])}
          for key in ('sp500','ndx','djdiv'):
              row=by_id.get(key) or {}
              assert row.get('basis_verified') is True, (key,row)
              assert isinstance(row.get('previous_close'), (int,float)) and row['previous_close'] > 0, (key,row)
              assert isinstance(row.get('previous_close_date'), str) and row['previous_close_date'], (key,row)

          fx=by_id.get('usdkrw') or {}
          # A missing contract marker means the newest runtime has not reached
          # production yet. That is a normal retry condition, not evidence that
          # the old runtime satisfies the new fail-closed contract.
          if fx.get('basis_contract') != EXPECTED_FX_CONTRACT:
              print('production FX fail-closed contract not deployed yet', json.dumps(fx, ensure_ascii=False))
              raise SystemExit(1)

          # During startup ECOS may not be ready yet. That transitional state is
          # allowed only if every public comparison field is null. A fallback
          # previous close/day change under basis_verified=false is a hard data-
          # integrity failure and must stop the workflow rather than be retried.
          if fx.get('basis_verified') is not True:
              guarded=('previous_close','previous_close_date','day_change','day_change_percent','basis_provider')
              unsafe={key: fx.get(key) for key in guarded if fx.get(key) is not None}
              if unsafe:
                  print('UNSAFE_UNVERIFIED_FX_BASIS', json.dumps({'unsafe':unsafe,'fx':fx}, ensure_ascii=False))
                  raise SystemExit(2)
              print('SAFE_UNVERIFIED_FX_BASIS_WAITING_FOR_ECOS', json.dumps(fx, ensure_ascii=False))
              raise SystemExit(1)

          assert isinstance(fx.get('last_value'), (int,float)) and fx['last_value'] > 0, fx
          assert isinstance(fx.get('previous_close'), (int,float)) and fx['previous_close'] > 0, fx
          assert isinstance(fx.get('previous_close_date'), str) and fx['previous_close_date'], fx
          assert 'ECOS' in str(fx.get('basis_provider') or ''), fx
          calc=(fx['last_value']/fx['previous_close']-1.0)*100.0
          assert abs(calc-float(fx.get('day_change_percent'))) < 0.011, fx
          assert abs((fx['last_value']-fx['previous_close'])-float(fx.get('day_change'))) < 0.011, fx

          ny_today=datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          for universe, section in (movers.get('sections') or {}).items():
              direction=section.get('direction')
              excluded_non_equity=section.get('excluded_non_equity_symbols')
              excluded_corporate_action=section.get('excluded_corporate_action_symbols')
              assert isinstance(excluded_non_equity, list), (universe, section)
              assert isinstance(excluded_corporate_action, list), (universe, section)
              assert all(isinstance(symbol, str) and symbol for symbol in excluded_non_equity), (universe, section)
              assert all(isinstance(symbol, str) and symbol for symbol in excluded_corporate_action), (universe, section)
              all_rows=[]
              for key in ('items','decliners','gainers'):
                  all_rows.extend(section.get(key) or [])
              symbols={str(item.get('symbol') or '') for item in all_rows}
              # The SCHD holdings parser once admitted USD (a leveraged ETF)
              # as if it were a stock constituent. The production feed must
              # remain equity-only and explain the deliberate exclusion.
              if universe == 'schd':
                  assert 'USD' not in symbols, section
                  assert 'USD' in excluded_non_equity, section
              # This assertion is date-scoped to the registered event. On the
              # documented 2026-10-01 CTVA/Vylor separation date raw CTVA
              # previous-close math is non-comparable; later dates are not
              # suppressed by this static event record.
              if universe == 'sp500' and ny_today == '2026-10-01':
                  assert 'CTVA' not in symbols, section
                  assert 'CTVA' in excluded_corporate_action, section
              for item in section.get('items') or []:
                  pct=float(item.get('day_change_percent'))
                  if direction == 'down':
                      assert pct < 0, (universe,direction,item)
                  elif direction == 'up':
                      assert pct > 0, (universe,direction,item)

          items=data.get('items', {})
          assert data.get('model_version') == '3.3-calibration-gated', data.get('model_version')
          for key in ('sp500','ndx','djdiv'):
              row=items.get(key) or {}
              assert isinstance(row.get('probability'), (int,float)), (key,row)
              assert isinstance(row.get('sample_size'), int), (key,row)
              assert 0 <= row['probability'] <= 100, (key,row)
              month=row.get('one_month') or {}
              assert isinstance(month.get('up_10_probability'), (int,float)), (key,month)
              assert isinstance(month.get('down_10_probability'), (int,float)), (key,month)
              assert 0 <= month['up_10_probability'] <= 100, (key,month)
              assert 0 <= month['down_10_probability'] <= 100, (key,month)
              assert isinstance(month.get('terminal_return_mode_label'), str) and month['terminal_return_mode_label'], (key,month)
              assert isinstance(month.get('terminal_return_mode_probability'), (int,float)), (key,month)
              assert 0 <= month['terminal_return_mode_probability'] <= 100, (key,month)
              assert month.get('terminal_return_bin_width_percent') == 2, (key,month)
              assert month.get('terminal_return_selection') in ('analog','baseline'), (key,month)
              assert isinstance(row.get('shadow_validation'), dict), (key,row)
              assert isinstance(row.get('milestone_60'), dict), (key,row)
              assert row['milestone_60'].get('threshold') in (60, None), (key,row['milestone_60'])
          print(json.dumps({'runtime_revision': status.get('runtime_revision'), 'status': by_id, 'push_health': push_health, 'movers': movers.get('sections')}, ensure_ascii=False, indent=2))
          PY
              validation_rc=$?
              set -e
              if [ "$validation_rc" -eq 0 ]; then
                exit 0
              fi
              if [ "$validation_rc" -eq 2 ]; then
                echo 'production integrity violation: unverified USD/KRW basis leaked comparison fields' >&2
                exit 2
              fi
            fi
            echo "production validation not ready yet: attempt $i/30"
            sleep 20
          done
          echo 'production endpoint did not pass validation in time' >&2
          exit 1
