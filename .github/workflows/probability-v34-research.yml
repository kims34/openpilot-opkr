name: Probability v3.4 regime research
on:
  push:
    branches: [index-alert-probability-v34-research]
    paths:
      - 'probability_research_v34.py'
      - 'probability_research_v34b.py'
      - 'probability_model.py'
      - 'probability_model_v33_runtime.py'
      - 'next_day_probability.py'
      - 'requirements.txt'
      - '.github/workflows/probability-v34-research.yml'
  workflow_dispatch:
concurrency:
  group: probability-v34-research
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run causal price-regime overlay research
        run: python probability_research_v34.py | tee probability-v34-result.json
      - name: Run OHLC and VIX overlay research
        run: python probability_research_v34b.py | tee probability-v34b-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: probability-v34-results
          path: |
            probability-v34-result.json
            probability-v34b-result.json
