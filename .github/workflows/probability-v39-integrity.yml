name: Probability v3.9 open-nowcast integrity
on:
  push:
    branches: [index-alert-server]
    paths:
      - 'probability_v39_open_nowcast.py'
      - 'probability_v39_integrity.py'
      - '.github/workflows/probability-v39-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify price basis and gap integrity
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import requests
          import next_day_probability as base
          import probability_v39_integrity as integ

          ny = ZoneInfo('America/New_York')
          for symbol in ('SPY','QQQ','SCHD'):
              rows, meta = base.fetch_history(symbol, time.time())
              base_map = dict(rows)
              response = requests.get(
                  f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}',
                  params={'range':'10y','interval':'1d','includePrePost':'false','events':'div,splits'},
                  headers={'User-Agent':'Mozilla/5.0 IndexAlert/3.9-integrity'}, timeout=20,
              )
              response.raise_for_status()
              result = (response.json().get('chart',{}).get('result') or [None])[0]
              ts = result.get('timestamp') or []
              q = (result.get('indicators',{}).get('quote') or [{}])[0]
              opens0 = q.get('open') or []
              closes0 = q.get('close') or []
              ohlc = {}
              for t, op, cl in zip(ts, opens0, closes0):
                  if op is None or cl is None or float(op) <= 0 or float(cl) <= 0:
                      continue
                  d = datetime.fromtimestamp(int(t), timezone.utc).astimezone(ny).date().isoformat()
                  ohlc[d] = (float(op), float(cl))
              dates = [d for d,_ in rows if d in ohlc]
              opens = [ohlc[d][0] for d in dates]
              raw_closes = [ohlc[d][1] for d in dates]
              validated = [base_map[d] for d in dates]
              out = integ.diagnose(opens, raw_closes, validated, dates, meta['target_date'])
              print('V39_INTEGRITY', symbol, json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
