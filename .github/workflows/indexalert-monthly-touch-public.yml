name: IndexAlert 21-session touch public-history pilot
on:
  push:
    branches: [indexalert-monthly-touch-research-20261116]
    paths:
      - research_monthly_touch_public_pilot.py
      - .github/workflows/indexalert-monthly-touch-public.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-history-study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical analysis requirements
        run: python -m pip install numpy==2.3.3 pandas==2.3.3 exchange-calendars==4.13.2 requests==2.32.3
      - name: Compare public-history touch probabilities; never deploy
        run: python research_monthly_touch_public_pilot.py
