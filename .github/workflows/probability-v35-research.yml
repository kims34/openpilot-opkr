name: Probability v3.5 holdout research
on:
  push:
    branches: [index-alert-server]
    paths:
      - 'probability_v35_research.py'
      - '.github/workflows/probability-v35-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Untouched 252-session holdout
        run: |
          python - <<'PY'
          import json, time
          import next_day_probability as base
          import probability_v35_research as research
          for symbol in ('SPY','QQQ','SCHD'):
              rows, meta = base.fetch_history(symbol, time.time())
              result = research.evaluate(
                  [p for _,p in rows],
                  [d for d,_ in rows],
                  meta['target_date'],
              )
              print('V35_RESEARCH', symbol, json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
