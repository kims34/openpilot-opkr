name: IndexAlert v32 Build Contract Smoke
on:
  push:
    branches: [ index-alert-server ]
    paths:
      - 'production_v31.py'
      - 'production_v32.py'
      - 'push_build_registration.py'
      - 'test_push_build_registration.py'
      - 'test_production_v32.py'
      - 'Dockerfile'
      - '.github/workflows/index-alert-v32-contract-smoke.yml'
  workflow_dispatch:

concurrency:
  group: index-alert-v32-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Full regression and v32 syntax
        run: |
          pip install -r requirements.txt
          python -m py_compile production_v31.py production_v32.py push_build_registration.py test_push_build_registration.py test_production_v32.py
          python -m unittest discover -p 'test_*.py' -v
      - name: Wait for exact production revision and verify build-bound push contract
        run: |
          set -u -o pipefail
          BASE='https://indexalert-runtime-production.up.railway.app'
          for i in $(seq 1 30); do
            validation_rc=1
            if curl -fsS --max-time 15 "$BASE/health" >/tmp/health.json && \
               curl -fsS --max-time 15 "$BASE/push-health" >/tmp/push-health.json && \
               curl -fsS --max-time 15 "$BASE/openapi.json" >/tmp/openapi.json && \
               curl -fsS --max-time 30 "$BASE/status" >/tmp/status.json && \
               curl -fsS --max-time 30 "$BASE/laggards" >/tmp/laggards.json && \
               curl -fsS --max-time 30 "$BASE/next-day-probabilities" >/tmp/prob.json; then
              set +e
              python - <<'PY'
          import json
          import os

          expected_revision = str(os.environ.get('GITHUB_SHA') or '').strip()
          expected_registration_contract = 'register-client-build-v1'
          expected_self_test_contract = 'android-register-direct-v1'

          health = json.load(open('/tmp/health.json'))
          push = json.load(open('/tmp/push-health.json'))
          openapi = json.load(open('/tmp/openapi.json'))
          status = json.load(open('/tmp/status.json'))
          movers = json.load(open('/tmp/laggards.json'))
          probabilities = json.load(open('/tmp/prob.json'))

          assert health.get('ok') is True, health
          assert health.get('firebase') is True, health
          if not expected_revision or status.get('runtime_revision') != expected_revision:
              print('production v32 revision not deployed yet', json.dumps({
                  'expected': expected_revision,
                  'actual': status.get('runtime_revision'),
              }, ensure_ascii=False))
              raise SystemExit(1)

          # Once the exact GitHub revision is live, missing build-contract
          # markers are not a rollout delay. They prove that the wrong runtime
          # entrypoint/route set is serving production and must fail immediately.
          if (
              push.get('registration_build_contract') != expected_registration_contract
              or push.get('self_test_trigger_contract') != expected_self_test_contract
          ):
              print('EXACT_REVISION_BUILD_CONTRACT_VIOLATION', json.dumps({
                  'runtime_revision': status.get('runtime_revision'),
                  'push_health': push,
              }, ensure_ascii=False))
              raise SystemExit(2)

          assert push.get('ok') is True, push
          assert push.get('firebase') is True, push
          assert push.get('tokens_exposed') is False, push
          assert push.get('client_receipts_supported') is True, push
          assert isinstance(push.get('registration_build_observed'), bool), push
          assert isinstance(push.get('current_build_physical_e2e_confirmed'), bool), push

          registered_build = push.get('latest_registered_client_build')
          self_test_build = push.get('latest_self_test_build')
          if registered_build is not None:
              assert isinstance(registered_build, str) and registered_build, push
          if self_test_build is not None:
              assert isinstance(self_test_build, str) and self_test_build, push
          if push['current_build_physical_e2e_confirmed']:
              assert registered_build == self_test_build and registered_build, push
              assert push.get('latest_self_test_sent') is True, push
              assert push.get('latest_self_test_receipt_confirmed') is True, push

          paths = openapi.get('paths') or {}
          assert '/register' in paths, paths
          assert '/push-self-test' in paths, paths
          assert '/push-ack' in paths, paths
          register_post = (paths.get('/register') or {}).get('post') or {}
          schema = (((register_post.get('requestBody') or {}).get('content') or {}).get('application/json') or {}).get('schema') or {}
          ref = str(schema.get('$ref') or '')
          assert ref.startswith('#/components/schemas/'), schema
          schema_name = ref.rsplit('/', 1)[-1]
          register_schema = ((openapi.get('components') or {}).get('schemas') or {}).get(schema_name) or {}
          assert 'client_build' in (register_schema.get('properties') or {}), register_schema

          assert isinstance(status.get('indices'), list) and status['indices'], status
          assert isinstance((movers.get('sections') or {}), dict), movers
          assert probabilities.get('model_version') == '3.3-calibration-gated', probabilities.get('model_version')

          print(json.dumps({
              'runtime_revision': status.get('runtime_revision'),
              'registration_build_contract': push.get('registration_build_contract'),
              'self_test_trigger_contract': push.get('self_test_trigger_contract'),
              'latest_registered_client_build': registered_build,
              'latest_self_test_build': self_test_build,
              'current_build_physical_e2e_confirmed': push.get('current_build_physical_e2e_confirmed'),
          }, ensure_ascii=False, indent=2))
          PY
              validation_rc=$?
              set -e
              if [ "$validation_rc" -eq 0 ]; then
                exit 0
              fi
              if [ "$validation_rc" -eq 2 ]; then
                echo 'v32 production integrity violation: exact revision is serving without the build-bound push contract' >&2
                exit 2
              fi
            fi
            echo "v32 production validation not ready yet: attempt $i/30"
            sleep 20
          done
          echo 'v32 production endpoint did not pass validation in time' >&2
          exit 1
