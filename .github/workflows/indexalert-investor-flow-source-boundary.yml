name: IndexAlert Isolated Investor Flow Source Boundary

on:
  push:
    branches:
      - indexalert-investor-flow-validation-v1
    paths:
      - research_v1_kiwoom_investor_flow_probe.py
      - test_research_v1_kiwoom_investor_flow_probe.py
      - research_v1_kiwoom_flow_source_gate.py
      - test_research_v1_kiwoom_flow_source_gate.py
      - research_v1_kiwoom_flow_pit_structural.py
      - test_research_v1_kiwoom_flow_pit_structural.py
      - research_v1_kiwoom_krx_flow_parity.py
      - test_research_v1_kiwoom_krx_flow_parity.py
      - research_v1_krx_flow_2022_receipt_gate.py
      - test_research_v1_krx_flow_2022_receipt_gate.py
      - research_v1_krx_flow_existing_private_checkpoint_inventory.py
      - test_research_v1_krx_flow_existing_private_checkpoint_inventory.py
      - research_v1_krx_flow_private_triple_proof.py
      - test_research_v1_krx_flow_private_triple_proof.py
      - research_v1_krx_flow_frozen_archive_bytes_gate.py
      - test_research_v1_krx_flow_frozen_archive_bytes_gate.py
      - research_v1_krx_flow_pandas_payload_integrity.py
      - test_research_v1_krx_flow_pandas_payload_integrity.py
      - .github/workflows/indexalert-investor-flow-source-boundary.yml
  pull_request:
    paths:
      - research_v1_kiwoom_investor_flow_probe.py
      - test_research_v1_kiwoom_investor_flow_probe.py
      - research_v1_kiwoom_flow_source_gate.py
      - test_research_v1_kiwoom_flow_source_gate.py
      - research_v1_kiwoom_flow_pit_structural.py
      - test_research_v1_kiwoom_flow_pit_structural.py
      - research_v1_kiwoom_krx_flow_parity.py
      - test_research_v1_kiwoom_krx_flow_parity.py
      - research_v1_krx_flow_2022_receipt_gate.py
      - test_research_v1_krx_flow_2022_receipt_gate.py
      - research_v1_krx_flow_existing_private_checkpoint_inventory.py
      - test_research_v1_krx_flow_existing_private_checkpoint_inventory.py
      - research_v1_krx_flow_private_triple_proof.py
      - test_research_v1_krx_flow_private_triple_proof.py
      - research_v1_krx_flow_frozen_archive_bytes_gate.py
      - test_research_v1_krx_flow_frozen_archive_bytes_gate.py
      - research_v1_krx_flow_pandas_payload_integrity.py
      - test_research_v1_krx_flow_pandas_payload_integrity.py
      - .github/workflows/indexalert-investor-flow-source-boundary.yml

permissions:
  contents: read

jobs:
  offline-source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse isolated source admission code
        run: python -m py_compile research_v1_kiwoom_investor_flow_probe.py test_research_v1_kiwoom_investor_flow_probe.py research_v1_kiwoom_flow_source_gate.py test_research_v1_kiwoom_flow_source_gate.py research_v1_kiwoom_flow_pit_structural.py test_research_v1_kiwoom_flow_pit_structural.py research_v1_kiwoom_krx_flow_parity.py test_research_v1_kiwoom_krx_flow_parity.py research_v1_krx_flow_2022_receipt_gate.py test_research_v1_krx_flow_2022_receipt_gate.py research_v1_krx_flow_existing_private_checkpoint_inventory.py test_research_v1_krx_flow_existing_private_checkpoint_inventory.py research_v1_krx_flow_private_triple_proof.py test_research_v1_krx_flow_private_triple_proof.py research_v1_krx_flow_frozen_archive_bytes_gate.py test_research_v1_krx_flow_frozen_archive_bytes_gate.py
      - name: Run offline synthetic metadata boundary tests
        run: python -m unittest -v test_research_v1_kiwoom_flow_source_gate.py test_research_v1_kiwoom_investor_flow_probe.py test_research_v1_kiwoom_flow_pit_structural.py test_research_v1_kiwoom_krx_flow_parity.py test_research_v1_krx_flow_2022_receipt_gate.py test_research_v1_krx_flow_existing_private_checkpoint_inventory.py test_research_v1_krx_flow_private_triple_proof.py test_research_v1_krx_flow_frozen_archive_bytes_gate.py

  offline-pandas-original-payload-digests:
    # Separate from the lean 171-test job: exact versions match the 2026-10-03
    # KRX dedicated private worker and are installed ONLY for synthetic CI.
    # No Railway secret, provider credential, KRX network query or raw data.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact frozen original worker data-frame dependency versions
        run: python -m pip install --disable-pip-version-check pandas==2.3.3 numpy==2.5.3
      - name: Parse independent original pandas source receipt verifier
        run: python -m py_compile research_v1_krx_flow_pandas_payload_integrity.py test_research_v1_krx_flow_pandas_payload_integrity.py
      - name: Check source-column and actual numeric-content fingerprints offline
        run: python -m unittest -v test_research_v1_krx_flow_pandas_payload_integrity.py
